<form class="layui-form layui-form-pane" action="" style="margin:10px 10px 10px 10px">
    <blockquote class="layui-elem-quote layui-text">
        可以将客户的手机号、旺旺/YY、QQ/微信任意一个添加到黑名单内。如果你需要设置在黑名单的客户不给录单，可以到系统维护/系统各项设置管理/订单相关设置，找到第68项设置
    </blockquote>
    <div class="layui-form-item">
        <label class="layui-form-label">电话号码</label>
        <div class="layui-input-block">
            <input type="tel" name="moblie" id="moblie" placeholder="请输入手机号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="11">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">旺旺/YY</label>
        <div class="layui-input-block">
            <input type="tel" name="ww" id="ww" placeholder="请输入旺旺或YY" autocomplete="off" class="layui-input layui-input-shadow" maxlength="30">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">QQ/微信号</label>
        <div class="layui-input-block">
            <input type="tel" name="qq" id="qq" placeholder="请输入QQ或微信号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="30">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">原因或备注</label>
        <div class="layui-input-block">
            <input type="text" name="remark" lay-verify="" maxlength="100" autocomplete="off" placeholder="请尽可能写清列入黑名单的原因，可空" class="layui-input layui-input-shadow">
        </div>
    </div>
    <div style="text-align:center;align-items:center">
        <button type="button" class="layui-btn layui-icon layui-toast layui-btn-normal layui-btn-lg w-lg" lay-submit="" lay-filter="savebtn">保存</button>
    </div>

</form>
