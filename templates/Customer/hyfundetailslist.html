<style>

</style>
<form class="layui-form" action="" lay-filter="fm">
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label">动账日期</label>
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="text" name="min" id="sDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(30) ]]">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="text" name="max" id="eDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">出入账</label>
                <div class="layui-input-inline">
                    <select name="type" id="fundFlows" lay-verify="">
                        <option value="">全部</option>
                        <option value="0">收入</option>
                        <option value="1">支出</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">渠道</label>
                <div class="layui-input-inline">
                    <select name="payMode" id="channel" lay-verify="">
                        <option value="">全部</option>
                        <option value="0">微信</option>
                        <option value="1">支付宝</option>
                        <option value="2">银行转账</option>
                        <option value="3">平台</option>
                        <option value="4">内部</option>
                        <option value="5">其它</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">操作人</label>
                <div class="layui-input-inline" style="width: 120px">
                    <select id="actionId" name="actionId" lay-search="">
                        <option value="">全部</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">搜索1</label>
                <div class="layui-input-inline">
                    <input type="text" name="keyword" id="key1" lay-verify="" placeholder="会员名称/会员号" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">搜索2</label>
                <div class="layui-input-inline">
                    <input type="text" name="orderNo" id="key2" lay-verify="" placeholder="订单号/手机号" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 120px">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据">刷新列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="exportBtn" type="button" title="导出当前查询的数据">导出查询数据</button>
            </div>
            <div style="color:#ff6a00" id="total"></div>
        </script>
    </div>
</form>
