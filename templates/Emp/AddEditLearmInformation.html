<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>

<form class="layui-form" action="">
    <div class="layui-form-pane" style="margin-top:10px;margin-left:10px">
        <div class="layui-form-item">
            <label class="layui-form-label">所属游戏</label>
            <div class="layui-input-inline">
                <select id="gameName" name="gameName" lay-filter="selectGame">
[% for gm in games %]<option value="[[ gm.gameId ]]"[% if o and o.gameId == gm.gameId %] selected='selected'[% endif %]>[[ gm.gameName ]]</option>[% endfor %]
</select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">资料/套餐标题</label>
            <div class="layui-input-block">
                <input type="text" name="title" id="title" lay-verify="required" autocomplete="off" placeholder="一句话描述资料标题/套餐名称" maxlength="50" class="layui-input layui-input-shadow boxshadow-success">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">标签/约接单价</label>
            <div class="layui-input-block">
                <input type="text" name="keys" id="keys" lay-verify="" autocomplete="off" placeholder="关键词标签或者套餐接单价" maxlength="20" class="layui-input layui-input-shadow boxshadow-success">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">标记/约发单价</label>
            <div class="layui-input-block">
                <input type="text" name="tips" id="tips" lay-verify="" autocomplete="off" placeholder="补充提示标记，或者套餐约发单价" maxlength="25" class="layui-input layui-input-shadow boxshadow-success">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">资料/套餐内容</label>
            <div class="layui-input-block">
                <textarea class="layui-textarea layui-hide" name="content" lay-verify="content" id="LAY_demo_editor"></textarea>
            </div>
        </div>
        <div style="text-align:center;align-items:center">
            <button type="button" class="layui-btn   layui-btn-normal w-lg" lay-submit="" lay-filter="savebtn">保存</button>
        </div>
    </div>
    <input type="hidden" name="id" value="0" />
</form> 
<script src="/JS2019/Emp/addeditlearminformation.js?v=1007" type="text/javascript"></script>

</body>
