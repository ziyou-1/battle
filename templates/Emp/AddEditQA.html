<form class="layui-form layui-form-pane" action="" style="padding:10px">
    <div class="layui-form-item">
        <label class="layui-form-label">所属类别</label>
        <div class="layui-inline">
            <select name="helperType" id="helperType" lay-filter="">               
            </select>
        </div>
        <div class="layui-inline adddiv">
            <span style="margin-right:10px"><a href="#" class="additem" style="color:#1E9FFF">新建分类</a></span>
        </div>
        <div class="layui-inline editdiv" style="display:none">
            <span style="margin-right:10px"><a href="#" class="edititem" style="color:#1E9FFF">编辑</a></span>
        </div>
        <div class="layui-inline deldiv" style="display:none">
            <span style="margin-right:10px"><a href="#" class="delitem" style="color:#ff0000">删除</a></span>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">标题</label>
        <div class="layui-input-block">
            <input type="text" name="title" id="title" lay-verify="required" placeholder="请输入标题" autocomplete="off" class="layui-input" maxlength="50">
        </div>
    </div>
    <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">内容</label>
        <div class="layui-input-block">
            <textarea class="layui-textarea" id="layeditDemo" name="layeditDemo" style="display: none;"></textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <button class="layui-btn" lay-submit="" lay-filter="postBtn">提交保存</button>
    </div>
    <input type="hidden" id="id" name="id" value="0" />
    <input type="hidden" id="typeid" name="typeid" />
