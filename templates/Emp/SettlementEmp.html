<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->

<style>

    .qrCodeBox img{
        width:98px;
        height:98px;
        margin-right:10px;
    }
    .qrCodeBox{
        display :flex;
        text-align:center;
        flex-wrap: wrap;
        color: red;
        font-size: 14px;
        line-height: 20px;
    }
</style>
<form class="layui-form layui-form-pane" action="" style="margin-left:10px;margin-right:10px;padding-bottom:20px">
    <blockquote class="layui-elem-quote">
        你正在进行给代练打手或销售人员进行账单结算或修改结算状态，请注意所勾选的绩效记录是否有误！注意：订单状态必须在待验收、已完成、已退单等时才可以改成已结算
    </blockquote>
    <div class="layui-form-pane" style="margin-top:10px;margin-right:10px;margin-bottom:10px">
        <div class="layui-form-item">
            <label class="layui-form-label">所选订单笔数</label>
            <div class="layui-input-block">
                <span style="margin-left:10px;line-height:36px;color:#ff0000">[[ sett.count ]]笔</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">预计要结总额</label>
            <div class="layui-input-block">
                <span style="margin-left:10px;line-height:36px;color:#ff0000;font-weight:600">[[ sett.total ]]元</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">实际需结总额</label>
            <div class="layui-input-block">
                <span style="margin-left:10px;line-height:36px;color:#ff0000;font-weight:600">[[ sett.real ]]元</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">结算对象</label>
            <div class="layui-input-block">
                <span style="margin-left:10px;line-height:36px;color:#ff0000;font-weight:600">[[ sett.names ]]</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">结算状态</label>
            <div class="layui-input-block">
                <input type="radio" name="sta" value="N" title="未结算" lay-filter="sta" [% if sett.allSettled %]checked[% endif %]>
                <input type="radio" name="sta" value="Y" title="已结算" lay-filter="sta" [% if not sett.allSettled %]checked[% endif %]>
            </div>
        </div>
        <div class="layui-form-item expdiv" style="display:none">
            <label class="layui-form-label">同步到账本</label>
            <div class="layui-input-block">
                <input type="radio" name="syncexp" value="N" title="不需要" checked="checked">
                <input type="radio" name="syncexp" value="Y" title="需要（将会在财务运营/日常账本里新增一笔支出款的记录）">
            </div>

        </div>
        <div class="layui-form-item expdiv" style="display:none">
            <label class="layui-form-label">微信收款码</label>
            <div class="layui-input-block">
                <div class="qrCodeBox"></div>
            </div>
        </div>
    </div>

    <div style="text-align:center;align-items:center">
        <button type="button" class="layui-btn  layui-btn-normal w-lg" lay-submit="" lay-filter="savebtn">确定结算或修改</button>
    </div>

    <input type="hidden" id="empIds" name="empIds" value="[[ sett.ids ]]" />
</form>
<script src="/JS2019/Emp/settlementemp.js?v=1011039" type="text/javascript"></script>
