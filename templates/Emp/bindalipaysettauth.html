<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>

<form class="layui-form" action="">
    <fieldset class="layui-elem-field layui-field-title">
        <div style="padding:10px 10px;border:1px solid  #f5c553;margin-top:5px">
            这里仅登记客户的支付宝付款账号，不会完成支付宝授权或打款。在线结算须先开通客户自己的支付宝商户应用及商家转账权限；在此之前请使用线下结算。
        </div>
    </fieldset>
    <div class="layui-form-pane newBindDiv" style="margin-top: 10px; margin-left: 10px; display: none">
        <div class="layui-form-item">
            <label class="layui-form-label" style="padding:8px 5px">结算用支付宝账号</label>
            <div class="layui-input-block">
                <input type="text" name="newPayAlipayAcc" id="newPayAlipayAcc" lay-verify="required" autocomplete="off" placeholder="用于结算的支付宝账号" maxlength="32" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">重复一遍账号</label>
            <div class="layui-input-block">
                <input type="text" name="reNewPayAlipayAcc" id="reNewPayAlipayAcc" lay-verify="required" autocomplete="off" placeholder="再次输入支付宝账号" maxlength="32" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="padding:8px 5px">支付宝实名</label>
            <div class="layui-input-block">
                <input type="text" name="newPayAlipayName" id="newPayAlipayName" autocomplete="off" placeholder="" maxlength="32" class="layui-input layui-input-shadow boxshadow-success" value="" lay-tips="如果是个人账户，就填真实姓名。如果是企业就填企业完整名称。个体工商户请填完整的名称，例如：XXX县XXX网络科技（个体工商户）">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">通道</label>
            <div class="layui-input-block">
                <input type="radio" name="channel" value="0" title="通道1">
                <div lay-radio><span lay-tips="绝大部分情况下请选择默认通道1">通道1</span></div>
                <input type="radio" name="channel" value="1" title="通道2">
                <div lay-radio><span lay-tips="请先咨询平台客服是否需要用通道2">通道2</span></div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注说明</label>
            <div class="layui-input-block">
                <input type="text" name="remark" id="remark" autocomplete="off" placeholder="" maxlength="50" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div style="text-align:center;align-items:center">
            <button type="button" class="layui-btn   layui-btn-normal w-lg" lay-submit="" lay-filter="savebtn">开始签约</button>
        </div>
    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据">刷新列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="addBookBtn" type="button" title="增加一个用于付款的支付宝账号">增加一个用于付款的支付宝账号</button>
            </div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-normal" style="" lay-event="submitReAuth" lay-tips="服务签约失效时可以点此重新签约">重新签约服务</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="submitDel" lay-tips="删除此绑定记录">删除此签约</a>
        </script>
    </div>

</form> 
<script src="/JS2019/Emp/BindAlipaySettAuth.js?v=10071121" type="text/javascript"></script>

</html>
