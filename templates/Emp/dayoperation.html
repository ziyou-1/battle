    <style>
        body {
            background-color: #fff
        } 
        .layadmin-pagetabs {
            height: 40px;

<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>

<link rel="stylesheet" type="text/css" href="/CSS/library.css" media="all">

<style>
    .tongji .layadmin-shortcut li .layui-icon {
        height: auto;
        padding-bottom: 15px;
        color: #FFBB00;
        font-size:45px;
    }
    .tongji .layui-input-block{
        margin-left:0;
    }
    .tongji .layadmin-shortcut li .layui-icon .tit {
        font-size: 16px;
        color: #333
    }
    .tongji .layui-col-lg3.width5 {
        width: 16.5% !important;
    }

<form class="layui-form" action="" style="background: #f2f2f2;">
    <div class="" style="padding-left: 5px;padding-top:10px;margin-bottom:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="">选择游戏</label>
                <div class="layui-input-inline" style="width:140px">
                    <select id="gameName" name="gameName" lay-filter="selectGame">
[% for gm in games %]<option value="[[ gm.gameId ]]" data-mobliegame="[[ gm.isMoblieGame ]]" data-pw="[[ gm.isPw ]]"[% if o and o.gameId == gm.gameId %] selected='selected'[% endif %]>[[ gm.gameName ]]</option>[% endfor %]
</select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="">录单时间</label>
                <div class="layui-input-inline">
                    <input type="text" name="sDate" id="sDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(31) ]]">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline">
                    <input type="text" name="eDate" id="eDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">接单客服</label>
                <div class="layui-input-inline">
                    <select name="inputOrderKefu" id="inputOrderKefu" xm-select="inputOrderKefu" xm-select-skin="default" xm-select-height="36px" class="" title=""></select>
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-row tongji" style="margin-bottom: 10px;">
        <div class="layui-col-lg12 layui-col-md12 layui-col-sm12 layui-col-xs12">
            <section class="layui-card">
                <div class="layui-card-header">
                   营业利润统计
                </div>
                <div class="layui-card-body">
                    <div class="layadmin-shortcut">
                        
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <input type="radio" name="statictype" value="10" lay-filter="statictype" title="按接单时间统计" checked>
                                <input type="radio" name="statictype" value="20" lay-filter="statictype" title="按交单时间统计">
                            </div>
                        </div>
                        <ul class="layui-row layui-col-space10">
                            <li class="layui-col-xs6 layui-col-sm6 layui-col-md3 layui-col-lg3 width5">
                                <div class="layui-icon" style="background: -webkit-linear-gradient(top,#F86738,#f34912); box-shadow: 0 3px 14px 2px #ffe4db;border-radius:10px">
                                    <div class="tit" style="color:#ffffff">搜索结果利润(不含已退单状态)</div>
                                    <div id="num5" lay-tips="计算方式：搜索条件范围内的总接单价-总发单价绩效-总记录退款金额" style="color:#ffffff">0</div>
                                </div>
                            </li>
                            <li class="layui-col-xs6 layui-col-sm6 layui-col-md3 layui-col-lg3 width5">
                                <div class="layui-icon" style="background: -webkit-linear-gradient(top,#23d4d4,#16d1b6); box-shadow: 0 3px 14px 2px #d1f6f1; border-radius: 10px ">
                                    <div class="tit" style="color:#ffffff">近一月利润(不含已退单状态)</div>
                                    <div id="num1" style="color:#ffffff" lay-tips="计算方式：搜索条件范围内的总接单价-总发单价绩效-总记录退款金额">0</div>
                                </div>
                            </li>
                            <li class="layui-col-xs6 layui-col-sm6 layui-col-md3 layui-col-lg3 width5">
                                <div class="layui-icon" style="background: -webkit-linear-gradient(top,#73D08D,#5FB878); box-shadow: 0 3px 14px 2px #cff8db; border-radius: 10px ">
                                    <div class="tit" style="color:#ffffff">上月利润(不含已退单状态)</div>
                                    <div id="num2" style="color:#ffffff" lay-tips="计算方式：搜索条件范围内的总接单价-总发单价绩效-总记录退款金额">0</div>
                                </div>
                            </li>
                            <li class="layui-col-xs6 layui-col-sm6 layui-col-md3 layui-col-lg3 width5">
                                <div class="layui-icon" style="background: -webkit-linear-gradient(top,#30A1F5,#1E9FFF); box-shadow: 0 3px 14px 2px #cee8fc; border-radius: 10px ">
                                    <div class="tit" style="color:#ffffff">近三月利润(不含已退单状态)</div>
                                    <div id="num3" style="color:#ffffff" lay-tips="计算方式：搜索条件范围内的总接单价-总发单价绩效-总记录退款金额">0</div>
                                </div>
                            </li>
                            <li class="layui-col-xs6 layui-col-sm6 layui-col-md3 layui-col-lg3 width5">
                                <div class="layui-icon" style="background: -webkit-linear-gradient(top,#FFC93B,#FFB800); box-shadow: 0 3px 14px 2px #ffd4e0; border-radius: 10px ">
                                    <div class="tit" style="color:#ffffff">近一年利润(不含已退单状态)</div>
                                    <div id="num4" style="color:#ffffff" lay-tips="计算方式：搜索条件范围内的总接单价-总发单价绩效-总记录退款金额">0</div>
                                </div>
                            </li>
                            <li class="layui-col-xs6 layui-col-sm6 layui-col-md3 layui-col-lg3 width5">
                                <div class="layui-icon" style="background: -webkit-linear-gradient(top,#CB5DEF,#9825D1); box-shadow: 0 3px 14px 2px #f1d0fd; border-radius: 10px ">
                                    <div class="tit" style="color:#ffffff">搜索结果退款(不含已退单状态)</div>
                                    <div id="num6" style="color:#ffffff" lay-tips="只统计搜索条件范围内的记录的退款金额">0</div>
                                </div>
                            </li>
                        </ul>

                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="layui-row  layui-col-space10 layui-echarts">
        <div class="layui-col-lg6 layui-col-md6 layui-col-sm12 layui-col-xs12">
            <section class="layui-card">
                <div class="layui-card-header">
                    订单主要来源分布图
                </div>
                <div class="layui-card-body">
                    <div id="soureOpertion" style="width: 100%;height:400px;"></div>
                </div>
            </section>
        </div>

        <div class="layui-col-lg6 layui-col-md6 layui-col-sm12 layui-col-xs12">
            <section class="layui-card">
                <div class="layui-card-header">
                    利润来源分布图
                </div>
                <div class="layui-card-body">
                    <div id="financialWageRep" style="width: 100%;height:400px;"></div>
                </div>
            </section>
        </div>

    </div>
    <div class="layui-row  layui-echarts">
        <div class="layui-col-lg12 layui-col-md12 layui-col-sm12 layui-col-xs12">
            <section class="layui-card">
                <div class="layui-card-header">
                    客服接单统计
                </div>
                <div class="layui-card-body">
                    <div id="KeFuOperation" style="width: 100%;height:400px;"></div>
                </div>
            </section>
        </div>
    </div> 

    <div class="layui-row  layui-echarts">
        <div class="layui-col-lg12 layui-col-md12 layui-col-sm12 layui-col-xs12">
            <section class="layui-card">
                <div class="layui-card-header">
                    订单数量、总价趋势图（已排除已退单部分）
                </div>
                <div class="layui-card-body">
                    <div id="totalPriceTrend" style="width: 100%;height:400px;"></div>
                </div>
            </section>
        </div>
    </div>



</form>
<script src="/JS2019/echarts.min.js" type="text/javascript"></script>
