<form class="layui-form" action="" lay-filter="fm1"> 
    <blockquote class="layui-elem-quote">
    <div class="layui-form-item"><div style="color:#ff6a00;font-weight:600;margin-bottom:10px" id="amtMsg"></div>
        
        <button class="layui-btn layui-btn-warm excash"  title="去提现">去提现</button>
    </div>
    </blockquote>
    
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">发生时间</label>
                <div class="layui-input-inline">
                    <input type="text" name="sDate" id="sDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(62) ]]">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline">
                    <input type="text" name="eDate" id="eDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                </div>
            </div>


            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px;">资金方向</label>
                <div class="layui-input-inline">
                    <select name="fundType" id="fundType" lay-filter="">
                        <option value="0">全部</option>
                        <option value="10">出账</option>
                        <option value="20">入账</option>
                    </select>
                </div>
            </div>


            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">搜索</label>
                <div class="layui-input-inline">
                    <input type="text" name="key" id="key" style="width:250px" lay-verify="" placeholder="订单号/支付流水号/备注关键字" autocomplete="off" class="layui-input" value="">
                </div>
            </div>


            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>

            <input type="hidden" id="jdpDesc" value="[[ sys.jdpKey ]]" />
        </div>
    </div>


    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
            </div>
            <div style="color:#ff6a00" id="total"></div>
        </script>
    </div>

</form>
