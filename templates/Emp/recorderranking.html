<div class="layui-form" style="padding: 10px; background-color: #F2F2F2;">
    <div class="layui-card">

            <div class="layui-row">
                <div class="layui-col-md3 layui-col-xs6">

[% for gm in games %]<option value="[[ gm.gameId ]]" data-mobliegame="[[ gm.isMoblieGame ]]" data-pw="[[ gm.isPw ]]"[% if o and o.gameId == gm.gameId %] selected='selected'[% endif %]>[[ gm.gameName ]]</option>[% endfor %]
</select>
                            </div>
                        </div>
                    </div>

                <div class="layui-col-md3 layui-col-xs6">
                    <div class="layui-form-pane">
                        <div class="layui-inline">
                            <label class="layui-form-label" style="width: 80px">排行方式</label>
                            <div class="layui-input-inline">
                                <select id="orderby" name="orderby" lay-filter="orderBy">
                                    <option value="0">按接单数量</option>
                                    <option value="1">按接单金额</option>
                                </select>
                            </div>
                        </div>
                    </div>
                   
                </div>

                                <input type="text" name="sDate" id="sDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(60) ]]">
                            </div>
                        </div>
                    </div>
                   
                </div>
                <div class="layui-col-md3 layui-col-xs6">

                            <div class="layui-input-inline">
                                <input type="text" name="eDate" id="eDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                            </div>

                </div>

<script type="text/javascript">
    layui.config({
        base: '../layuiadmin/'
    }).extend({
        index: 'lib/index'
    }).use(['index', 'form', 'util', 'laydate', 'table'], function () {
        var $ = layui.$,
            form = layui.form,
            util = layui.util;
        laydate = layui.laydate;
        var table = layui.table;
        var devices = layui.device();
        var isPc = true;
        if (devices.android === true || devices.ios === true) {
            isPc = false;
        }
        var re = true;  
        var indexLoad;
        laydate.render({
            elem: '#sDate'
            , type: 'date'
            ,min:-90
            , done: function (value, date, endDate) {
                sDate = value;
                reloadOrderList();
            }
        });
        laydate.render({
            elem: '#eDate'
            , type: 'date'
            , min: -90
            , done: function (value, date, endDate) {
                eDate = value;
                reloadOrderList();
            }
        });

        var sDate = $("#sDate").val();
        var eDate = $("#eDate").val();
        reloadOrderList();
        form.on('select(selectGame)', function (data) { 
            sDate = $("#sDate").val();
            eDate = $("#eDate").val();
            reloadOrderList(); 
        }); 
        form.on('select(orderBy)', function (data) {
            sDate = $("#sDate").val();
            eDate = $("#eDate").val();
            reloadOrderList();
        });
        function reloadOrderList() {
            var gameName = $("#gameName").find("option:selected").text();          
            var type = $("#orderby").val(); 
            if (!re)
                return false;
            re = false;
            $.ajax({
                type: "Post",
                url: "/EmpAjax/GetRecOrderRankList",
                data: { gameName: gameName, stime: sDate, etime: eDate, type:type },
                dataType: 'json',
                cache: false,
                timeout: 60000,
                error: function () { layer.msg('读取错误！'); re = true; },
                beforeSend: function (XMLHttpRequest) { indexLoad = layer.load(1, { shade: false }); },
                success: function (data) {
                    re = true;
                    if (data.msg == "请先登录") {
                        layer.msg("登录过期了，请重新登录系统");
                        return;
                    }
                    if (isPc) {
                        $(".layui-table").attr("lay-size", "lg");
                    } else {
                        $(".layui-table").removeAttr("lay-size");
                    }
                    if (data.code > 0) {
                        var resList = data.data;
                        var Html = '';
                       
                        for (var i = 0; i < resList.length; i++) {
                            Html += '<tr style="' + (resList[i].idx < 4 ? "color:#FF5722" : "") + '">'
                                + '<td>' + resList[i].idx + '</td>'
                                 + '<td>' + resList[i].userName + '</td>'
                                 + '<td>' + resList[i].orderCount + '</td>'
                                 + '<td>' + resList[i].orderAmount + '</td>'
                                 + '</tr>';
                        }
                        $('#tables').html(Html);
                    }
                    else {
                        $('#tables').html('');
                    }
                    form.render();
                },
                complete: function (XMLHttpRequest) {
                    layer.close(indexLoad);
                }
            });
 
            return false;
        }
        
    });
</script>
