    <style>
        body {
            background-color: #fff
        } 
        .layadmin-pagetabs {
            height: 40px;

<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->

      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>

<style>
    .charViewboxs .item {
        display: inline-block;
        width: 36px;
        height: 25px;
        line-height: 25px;
        box-sizing: border-box;
        text-align: center;
        border-radius: 2px;
        border: 1px solid #A3AFB7;
        color: #A3AFB7;
        margin: 5px;
        cursor:pointer;
    }

        .charViewboxs .item.active {
            border: 1px solid #FDA601;
            color: #FDA601;
        }
    .layui-inline .layui-form-radio div.sel {
        color: #FDA601;
    }
    .layui-inline .layui-form-radio div.sel2 {
        color: #ff0000;
        font-weight:600;
        font-size:24px;
    }

</style>

<form class="layui-form layui-form-pane" action="" style="margin-left:10px;margin-right:10px">
    <div class="layui-field-box" style="margin-left:0px;padding: 0px 0px;margin-top:10px">
        <div class="layui-form-item" pane="">
            <label class="layui-form-label">按字母索引</label>
            <div class="layui-input-block">
                <div class="charViewboxs"></div>
            </div>
        </div>
        <div class="layui-form-item" pane="">
            <div class="layui-inline">
                <label class="layui-form-label">搜索游戏名称</label>
                <div class="layui-input-inline">
                    <select lay-search="" lay-filter="seachGame">
                        <option value="">请选择或搜索</option>
[% for g in catalog %]<option value="[[ g.name ]]">[[ g.name ]]</option>[% endfor %]


                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 120px">搜索</button>
                </div>
            </div>
        </div>
        <div class="layui-form-item" pane="">
            <label class="layui-form-label">请选择游戏</label>
            <div class="layui-input-block">
[% for g in catalog %]<div class="layui-inline" style="width:200px"><input type="radio" name="games" value="[[ g.name ]]" data-isPw="[[ g.isPw ]]" data-isMoblie="[[ g.isMoblie ]]" title="[[ g.name ]]" data-name="[[ g.name ]]" data-firstKey="[[ g.firstKey ]]" lay-filter="" /></div>[% endfor %]


            </div>
        </div>
    </div>

    <blockquote class="layui-elem-quote" style="color:#ff6a00">如果列表里没有找到需要添加的游戏，可以联系平台客服或技术添加</blockquote>

    <div style="text-align:center;align-items:center">
        <button type="button" class="layui-btn layui-btn-normal w-lg" lay-submit="" lay-filter="savebtn">确定添加到本系统</button>
    </div>


</form>
<script src="/JS2019/Game/addeditgame.js?v=20210918011" type="text/javascript"></script>


</body>
