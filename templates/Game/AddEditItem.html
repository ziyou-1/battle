<form class="layui-form layui-form-pane" action="" style="margin-left:10px;margin-right:10px">
    <div class="layui-form-pane" style="margin-top:10px;margin-right:10px">

        <div class="layui-form-item">
            <label class="layui-form-label">物品名称</label>
            <div class="layui-input-block">
                <input type="text" name="itemName" id="itemName" lay-verify="required" autocomplete="off" placeholder="请输入物品名称" maxlength="50" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">物品部位</label>
            <div class="layui-input-block">
                <select name="postion" id="postion" xm-select-radio xm-select="postion" xm-select-skin="default" xm-select-height="36px">
                    <option value="头部" selected="selected">头部</option>
                    <option value="项链">项链</option>
                    <option value="肩部">肩部</option>
                    <option value="披风">披风</option>
                    <option value="胸部">胸部</option>
                    <option value="护腕">护腕</option>
                    <option value="手套">手套</option>
                    <option value="腰带">腰带</option>
                    <option value="腿部">腿部</option>
                    <option value="靴子">靴子</option>
                    <option value="戒指">戒指</option>
                    <option value="饰品">饰品</option>
                    <option value="单手武器">单手武器</option>
                    <option value="双手武器">双手武器</option>
                    <option value="副手武器">副手武器</option>
                    <option value="盾牌">盾牌</option>
                    <option value="其它部位">其它部位</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">护甲类别</label>
            <div class="layui-input-block">
                <select name="arrType" id="arrType" xm-select-radio xm-select="arrType" xm-select-skin="default" xm-select-height="36px">
                    <option value="无" selected="selected">无</option>
                    <option value="皮甲">皮甲</option>
                    <option value="锁甲">锁甲</option>
                    <option value="板甲">板甲</option>
                    <option value="布甲">布甲</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">掉落BOSS</label>
            <div class="layui-input-block">
                <select style="" name="boss" id="boss" xm-select-radio lay-search="" xm-select-create xm-select="boss" xm-select-skin="default" xm-select-height="36px" xm-select-search="" xm-select-search-type="title">
                    <option value="">选择或输入BOSS名称</option>
                </select>
            </div>
        </div> 
        <div class="layui-form-item layui-form-text" style="margin-left:110px">
            <a href="http://db.178.com/wow/cn/item/139164.html" target="_blank" class="layui-form-label" style="color:#0094ff">178UBB物品详情代码（目前仅限于魔兽世界，点此可跳转到178装备数据库）</a>
            <div class="layui-input-block">
                <textarea placeholder="请在178装备详情页面找到UBB代码，将“UBB论坛代码”复制粘贴到此处即可" name="UBB" maxlength="2200" class="layui-textarea" style=" height:220px"></textarea>
            </div>
        </div>
    </div>

    <div style="text-align:center;align-items:center">
        <button type="button" class="layui-btn layui-btn-normal w-lg" lay-submit="" lay-filter="savebtn">确定保存</button>
    </div>

    <input type="hidden" id="gameId" name="gameId" value="21708" />
