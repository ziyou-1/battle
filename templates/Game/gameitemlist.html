    <style>
        body {
            background-color: #fff
        } 
        .layadmin-pagetabs {
            height: 40px;

            padding: 0 80px 0 40px;

<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>

<style type="text/css">
    .layui-table-cell {
        height: 40px;
        line-height: 40px;
        padding: 0 5px;
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
        font-size: 12px;
    }

    .lableb {
        display: inline-block;
        padding: 2px 4px;
        font-size: 12px;
        line-height: 14px;
        color: #fff;
        white-space: nowrap;
        vertical-align: middle;
        background-color: #999;
        overflow: hidden;
        border-radius: 3px;
        margin-right: 2px;
    }

    .layui-form-pane .layui-form-label {
        width: 110px;
        padding: 8px 8px;
        height: 38px;
        line-height: 20px;
        border-width: 1px;
        border-style: solid;
        border-radius: 2px 0 0 2px;
        text-align: center;
        background-color: #FBFBFB;
        overflow: hidden;
        box-sizing: border-box;
    }

    .layui-btn {
        margin-bottom: 15px;
        margin-right: 8px;
    }
</style>

<form class="layui-form" action="" lay-filter="pro">
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">选择游戏</label>
                <div class="layui-input-inline">
                    <select id="gameName" name="gameName" lay-filter="selectGame">
[% for gm in games %]<option value="[[ gm.gameId ]]"[% if o and o.gameId == gm.gameId %] selected='selected'[% endif %]>[[ gm.gameName ]]</option>[% endfor %]
</select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">物品部位</label>
                <div class="layui-input-inline">
                    <select name="postion" id="postion" xm-select-radio xm-select="postion" xm-select-skin="default" xm-select-height="36px">
                        <option value="" selected="selected">全部</option>
                        <option value="头部">头部</option>
                        <option value="项链">项链</option>
                        <option value="肩部">肩部</option>
                        <option value="披风">披风</option>
                        <option value="胸部">胸部</option>
                        <option value="护腕">护腕</option>
                        <option value="手套">手套</option>
                        <option value="腰带">腰带</option>
                        <option value="腿部">腿部</option>
                        <option value="靴子">靴子</option>
                        <option value="戒指">戒指</option>
                        <option value="饰品">饰品</option>
                        <option value="单手武器">单手武器</option>
                        <option value="双手武器">双手武器</option>
                        <option value="副手武器">副手武器</option>
                        <option value="盾牌">盾牌</option>
                        <option value="其它部位">其它部位</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">搜索</label>
                <div class="layui-input-inline">
                    <input type="text" name="key" id="key" lay-verify="" placeholder="物品名称" autocomplete="off" class="layui-input layui-input-shadow" value="">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="margin-bottom:0px">搜索</button>
                </div>
            </div>
        </div> 
    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon layui-icon-refresh-3"></i>刷新数据</button>
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="addItemBtn" type="button" title="新增一个物品"><i class="layui-icon layui-tianjiazujian"></i>新增物品</button>
                <button class="layui-btn layui-btn-xs " lay-event="delItemBtn" type="button" title="删除指定物品"><i class="layui-icon layui-shanchu"></i>删除物品</button>
            </div>
            <div style="color:#ff6a00" id="total"></div>
        </script>

        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="submitEdit" title="编辑项目名称"><i class="layui-icon layui-icon-edit"></i></a>
        </script>
    </div>
     
</form> 
<script src="/JS2019/Game/gameitemlist.js?v=20260427" type="text/javascript"></script>

</body>
</html>
