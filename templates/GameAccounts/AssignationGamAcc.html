<style>
    .layui-form-radio * {
        font-size: 12px;
    }

    .layui-form-item {
        margin-bottom: 5px;
        clear: both;
    }

    .layui-table-cell {
        height: 40px;
        line-height: 40px;
        padding: 0 5px;
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
        font-size: 12px;
    }

    .lableb {
        display: inline-block;
        padding: 2px 4px;
        font-size: 12px;
        line-height: 14px;
        color: #fff;
        white-space: nowrap;
        vertical-align: middle;
        background-color: #999;
        overflow: hidden;
        border-radius: 3px;
        margin-right: 2px;
    }

    .layui-form-pane .layui-form-label {
        width: 110px;
        padding: 8px 8px;
        height: 38px;
        line-height: 20px;
        border-width: 1px;
        border-style: solid;
        border-radius: 2px 0 0 2px;
        text-align: center;
        background-color: #FBFBFB;
        overflow: hidden;
        box-sizing: border-box;
    }
</style>

<form class="layui-form layui-form-pane" action="" style="margin-left:10px;margin-right:10px">
    <div class="layui-field-box" style="margin-left:0px;padding: 0px 0px;margin-top:3px">
        <div class="layui-form-item" pane="">
            <label class="layui-form-label">用户职位</label>
            <div class="layui-input-block">
                <input type="radio" name="userRole" lay-filter="userRole" value="0" title="全部" checked="">
[% for r in roles %]<input type="radio" name="userRole" lay-filter="userRole" value="[[ r.id ]]" title="[[ r.roleName ]]">[% endfor %]


            </div>
        </div>
        <div class="layui-form-item" style="margin-bottom:0px">
            <label class="layui-form-label">搜索用户</label>
            <div class="layui-input-inline" style=" ">
                <input type="text" name="key1" id="key1" lay-verify="" placeholder="用户名/名称/标记" autocomplete="off" class="layui-input" value="">
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList" title="" style=""></table>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-normal" style="" lay-event="addAss" title="将该账号指派给这个接手人">指派给TA</a>
        </script>
    </div>
    <a class="layui-btn layui-btn-sm layui-btn-danger cleanRec" style="" title="清除当前该账号的接手人">清除当前接手人</a>
    <input type="hidden" id="gameName" name="gameName" value="[[ acc.gameName if acc else "" ]]" />
    <input type="hidden" id="accId" name="accId" value="[[ acc.gameAccId if acc else 0 ]]" />
    <input type="hidden" id="currentRecUserName" name="currentRecUserName" value="[[ acc.recUserName if acc else "" ]]" />
</form>
<script src="/JS2019/GameAccounts/assignationgamacc.js?v=1101" type="text/javascript"></script>
