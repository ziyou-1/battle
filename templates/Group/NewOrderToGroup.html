<form class="layui-form" action="">
    <div class="" style="padding-left: 5px;padding-top:10px;margin-right:5px">

        <div class="layui-form-pane">
            <div class="layui-form-item">
                <div class="layui-inline" style="width:40%">
                    <label class="layui-form-label" style="">排团指挥/区分</label>
                    <div class="layui-input-block">
                        <select name="leader" id="leader" xm-select-radio lay-search="" xm-select="leader" xm-select-skin="default" xm-select-height="36px" xm-select-search="" xm-select-search-type="title">
                            <option value="">请选择排团指挥或区分的标记人员，不选代表所有</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline" style="width:40%">
                    <label class="layui-form-label" style="">排团名称/项目名</label>
                    <div class="layui-input-block">
                        <input type="text" name="title" id="title" lay-verify="" autocomplete="off" placeholder="可以输入排团名称/项目名称查询" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline" style="width:9%">
                    <div class="layui-input-inline" style="">
                        <a class="layui-btn layui-btn-normal seachBtn">搜索</a>
                        <a class="layui-btn layui-btn-danger saveConfigBtn layui-disabled" disabled="" title="点击可以保存当前筛选条件作为默认搜索条件">保存筛选</a>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" style="">排团日期</label>
                <div class="layui-input-block">
[% for d in taskDates %]<input type="checkbox" name="taskDate" value="[[ d.value ]]" title="[[ d.title ]]" lay-filter="taskDatefilter">[% endfor %]


                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space5">

        </div>

    </div>
    <input type="hidden" id="gameID" name="gameID" value="[[ o.gameId ]]" />
    <input type="hidden" id="orderId" name="orderId" value="[[ o.orderId ]]" />
    <input type="hidden" id="gameName" name="gameName" value="[[ o.gameName ]]" />
    <input type="hidden" id="selectTaskUserId" name="selectTaskUserId" value="0" /> 
</form>
