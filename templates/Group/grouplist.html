    <style>
        body {
            background-color: #fff
        } 
        .layadmin-pagetabs {
            height: 40px;
            line-height: 40px;
            padding: 0 80px 0 40px;

                background-color: #009688;
                color: #fff;
            }

<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->

      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>

<style type="text/css">
    .layui-table-cell {
        height: 40px;
        line-height: 40px;
        padding: 0 5px;
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
        font-size: 12px;
    }

    .lableb {
        display: inline-block;
        padding: 2px 4px;
        font-size: 12px;
        line-height: 14px;
        color: #fff;
        white-space: nowrap;
        vertical-align: middle;
        background-color: #999;
        overflow: hidden;
        border-radius: 3px;
        margin-right: 2px;
    }
</style>
<form class="layui-form" action="">
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">选择游戏</label>
                <div class="layui-input-inline">
                    <select id="gameName" name="gameName" lay-filter="selectGame">
[% for gm in games %]<option value="[[ gm.gameId ]]" data-mobliegame="[[ gm.isMoblieGame ]]" data-pw="[[ gm.isPw ]]"[% if o and o.gameId == gm.gameId %] selected='selected'[% endif %]>[[ gm.gameName ]]</option>[% endfor %]
</select>
                </div>
            </div>

            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">排团状态</label>
                <div class="layui-input-inline">
                    <select name="taskSta" id="taskSta">
                        <option value="" selected=&#39;selected&#39;>请选择</option>
                        <option value="A" >未开始</option>
                        <option value="B" >进行中</option>
                        <option value="C" >已完成</option>
                        <option value="D" >已暂停</option>
                    </select>
                </div>
            </div>

            <div class="layui-inline">
                <label class="layui-form-label">团队指挥</label>
                <div class="layui-input-inline">
                    <select name="leader" id="leader" xm-select-radio lay-search="" xm-select="leader" xm-select-skin="default" xm-select-height="36px" xm-select-search="" xm-select-search-type="title">
                        <option value="">选择或输入</option>
                    </select>
                </div>
            </div>

            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">排序方式</label>
                <div class="layui-input-inline">
                    <select name="taskSort" id="taskSort">
                        <option value="0" selected=&#39;selected&#39;>按自定义大到小排序</option>
                        <option value="1" >按建团时间倒序</option>
                        <option value="2" >按建团时间正序</option>
                        <option value="3" >按开始时间倒序</option>
                        <option value="4" >按开始时间正序</option>
                    </select>
                </div>
            </div>

            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">搜索</label>
                <div class="layui-input-inline">
                    <input type="text" name="key" id="key" lay-verify="" placeholder="排团编号/排团名称" autocomplete="off" class="layui-input layui-input-shadow">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
                <div class="layui-input-inline" style="margin-left:10px">
                    <a class="layui-btn layui-btn-warm saveConfigBtn" style="width: 80px">保存筛选</a>
                </div>
            </div>
        </div>
    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
                <button class="layui-btn layui-btn-xs" lay-event="changeStaBtn" type="button" title="批量更改勾选的排团状态">批量改状态</button>
                <button class="layui-btn layui-btn-xs" lay-event="exportreccountBtn" type="button" title="批量导出选定排团做模拟工资表">导出选定排团做模拟工资表</button>
                <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="upLevelBtn" type="button" title="上传或查看排团装等要求图片">统一装等要求图片</button>
                <button class="layui-btn layui-btn-xs" lay-event="delBtn" type="button" title="删除勾选的排团">删除排团</button>
            </div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="submitEdit" title="编辑排团"><i class="layui-icon layui-icon-edit"></i></a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="submitDel" title="删除排团"><i class="layui-icon layui-icon-delete"></i></a>
        </script>
    </div>
    <div class="setStaDiv" style="display:none">
        <div class="layui-form-item" style="margin-top:10px">
            <label class="layui-form-label">选择状态</label>
            <div class="layui-input-block">
                <input type="radio" name="sta" value="A" title="未开始">
                <input type="radio" name="sta" value="B" title="进行中">
                <input type="radio" name="sta" value="C" title="已完成">
                <input type="radio" name="sta" value="D" title="已暂停">
            </div>
        </div>
        <div class="layui-form-item" style="margin-top:20px">
            <label class="layui-form-label"></label>
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" type="button" lay-submit="" lay-filter="saveSettbtn"><i class="layui-icon">&#x1005;</i>保存</button>
            </div>
        </div>
    </div>

    <div class="changeDate" style="display:none">
        <div class="layui-form-item" style="margin-top:10px;margin-left:10px">
            <div class="layui-inline">
                <input type="text" name="sDate" id="sDate" lay-verify="" placeholder="点击选择日期" autocomplete="off" class="layui-input" value="">
            </div>
            <div class="layui-inline" style="width:130px">
                <input type="text" name="sHour" id="sHour" lay-verify="" placeholder="输入2位数字的小时" autocomplete="off" class="layui-input" value="00" maxlength="2">
            </div>
            <div class="layui-inline" style="width:130px">
                <input type="text" name="sMin" id="sMin" lay-verify="" placeholder="输入2位数字的分钟" autocomplete="off" class="layui-input" value="00" maxlength="2">
            </div>
        </div>
        <div class="layui-form-item" style="margin-top:20px;text-align:center">
            <a href="#" class="layui-btn layui-btn-normal saveChangeDate"><i class="layui-icon">&#x1005;</i>保存</a>
        </div>

    </div>
    <div class="groupleveldiv" style="display:none">
        <div class="layui-form-item" style="margin-top:20px">
            <label class="layui-form-label"></label>
            <div class="layui-input-block">
                <a class="layui-btn layui-btn-sm" id="uploadOne">点我重新上传图片</a>
                <a href="" title="点击查看" class="newspic" target="_blank" style="color:#ff6a00"></a>
            </div>
        </div>
        <div class="layui-form-item" style="display:flex;justify-content:center;align-items:center">
            <img src="" id="levelImg" width="90%" />
        </div>
    </div>
    <input type="hidden" id="leaderIds" name="leaderIds" value="0" />

</form>
<script src="/JS2019/Group/grouplist.js?v=20260427" type="text/javascript"></script>



</body>
</html>
