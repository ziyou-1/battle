                            <p>功能介绍：</p>
                            <p>您只需要在这里填入最基本的信息，提交后就会生成一笔待完善资料的订单链接，把链接复制给客户让客户自行补充其它资料。</p>

[% for gm in games %]<option data-mobliegame="[[ gm.isMoblieGame ]]" data-pw="[[ gm.isPw ]]" data-accpwd="[[ "N" if gm.isNotAccPwd == "Y" else "Y" ]]" >[[ gm.gameName ]]</option>[% endfor %]
