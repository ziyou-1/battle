<form class="layui-form layui-form-pane formpop" action="" >

    <div class="layui-field-box" style="margin-left:0px;padding: 0px 0px;margin-top:3px">
        <div class="layui-form-item" pane="">
            <label class="layui-form-label">用户职位</label>
            <div class="layui-input-block">
                <input type="radio" name="userRole" lay-filter="userRole" value="0" title="全部" checked="">
                            <input type="radio" name="userRole" lay-filter="userRole" value="3" title="客服" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="5" title="总经理" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="6" title="系统管理员" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="7" title="客服主管" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="13" title="代练员" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="19" title="系统开发员" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="20" title="外部录单用" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="21" title="售后客服" >
                            <input type="radio" name="userRole" lay-filter="userRole" value="22" title="机器人专用" >

                <button class="layui-btn layui-btn-warm layui-btn-xs layui-disabled saveConfigBtn" lay-submit="" type="button" lay-filter="saveConfigBtn" style="" disabled="" title="保存选中的职位，下次进入该界面默认就是筛选该职位">保存筛选</button>
            </div>
        </div>
        <div style="display:flex">
                <div class="layui-form-item" pane="">
                    <label class="layui-form-label">业务类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="bussType" value="0" title="代练+陪玩" checked lay-filter="bussTypechange">
                        <input type="radio" name="bussType" value="1" title="代练" lay-filter="bussTypechange">
                        <input type="radio" name="bussType" value="2" title="陪玩" lay-filter="bussTypechange">
                    </div>
                </div>
                <div class="layui-form-item" pane="" style="flex: 1">
                    <label class="layui-form-label">排序方式</label>
                    <div class="layui-input-block">
                        <input type="radio" name="userOrderBy" value="0" title="默认排序" checked=&#39;checked&#39; lay-filter="userOrderBy">
                        <input type="radio" name="userOrderBy" value="1" title="按用户排序值大到小"  lay-filter="userOrderBy">
                    </div>
                </div>
        </div>


        <div class="layui-form-item" style="margin-bottom:0px">
            <label class="layui-form-label">搜索人员</label>
            <div class="layui-input-inline" style=" ">
                <input type="text" name="key1" id="key1" lay-verify="" placeholder="用户名/名称/标记" autocomplete="off" class="layui-input" value="">
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal sechbtn" lay-submit="" type="button" lay-filter="seachBtn" style="">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-row" style="display: flex; height: 200px; flex: 1; ">
        <div >
            <div class="user_top">
                <div class="layui-inline" style="width:185px">
                    <input type="radio" name="recUser" lay-skin="primary" title="指派打手" value="-1" lay-filter="recUser" checked="checked">
                </div>
                <div class="layui-inline" style="width: 185px">
                    <input type="radio" name="recUser" lay-skin="primary" title="暂不指派" value="0" lay-filter="recUser">
                </div>
                <div class="layui-inline" style="width: 185px">
                    <input type="radio" name="recUser" lay-skin="primary" title="内部抢单" value="999999" lay-filter="recUser">
                </div>
            </div>
            <div class="user" style="margin-left: 0px; overflow: auto; height: 100%; ">
            </div>
        </div>
        <div style="flex: 1; min-width: 30%; display:none" class="assdiv">
            <fieldset class="layui-elem-field " >
                <legend style="font-size:14px">当前指派的接手人</legend>
                <div class="layui-field-box" >
                    <div style="width:100%">
                        <table class="layui-hide" id="tableList2" lay-filter="tableList2" title=""></table>
                        <script type="text/html" id="baroperating2">
                            <a class="layui-btn layui-btn-xs layui-btn-danger" style="margin-right:1px" lay-event="delAss" title="移除该接手人的指派">移除</a>
                        </script>
                    </div>
                </div>
            </fieldset>
        </div>
    </div>
    <div style="display: flex; justify-content: center; margin-top: 55px; ">
        <div class="layui-btn layui-btn-normal layui-btn-lg" id="saveBtnPop">确定</div>
        <div class="layui-btn layui-btn-danger layui-btn-lg" style="display:none" id="clearBtnPop">清除</div>
    </div>
    <input id="selectUserData" value="0" hidden>
    <input id="gameNameVal" value="0" hidden>
</form>
