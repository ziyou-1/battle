<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>

<form class="layui-form layui-form-pane" action="" style="padding-top:10px;margin-left:10px;margin-right:10px">
    <blockquote class="layui-elem-quote" style="color:#ff6a00;padding:8px">
        可自定义多种不同内容的短信模板，方便在此处调用。
        <a lay-href="/System/smssetting" lay-text="短信设置" lay-tips="短信设置" style="color:#ff6a00">
            <cite>点击这里进行短信设置</cite>
        </a>
    </blockquote>
    <div class="layui-form-item">
        <label class="layui-form-label" style="width:110px;padding:8px 10px">常用短信模板</label>
        <div class="layui-input-block">
                        <input type="radio" name="SmsType" value="15" title="录单时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="16" title="改代练中时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="17" title="代练接手时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="18" title="改代验收时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="19" title="改已完成时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="20" title="改问题单时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="21" title="改已暂停时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="22" title="改异常中时" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="23" title="指派后通知打手" lay-filter="SmsType">
                        <input type="radio" name="SmsType" value="24" title="改已暂停通知打手" lay-filter="SmsType">
                    <input type="radio" name="SmsType" value="100009" title="团1开打时短信" lay-filter="SmsType">
                    <input type="radio" name="SmsType" value="100010" title="团2开打时短信" lay-filter="SmsType">

            <input type="radio" name="SmsType" value="100013" title="自定义发送内容" lay-filter="SmsType">

        </div>
    </div>
    <div class="layui-form-item zdy" style="display:none">
        <label class="layui-form-label">自定义内容：</label>
        <div class="layui-input-block">
            <input type="text" name="customize" id="customize" lay-verify="" autocomplete="off" placeholder="可在此输入本次要发送的短信内容，请勿发送营销类短信，不能含有微信、加Q、加群、公众号、网址等内容" class="layui-input layui-input-shadow boxshadow-success" maxlength="300">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <p style="color:#ff0000">请点击相应常用短信模板进行发送。若需要发送自编的短信，请点击“自定义发送内容”后在上面输入要发送的短信内容。短信内容不能包含任何营销、推广、网址、加Q、加微信、加群、好评、返现、红包、公众号等字眼，否则发送失败。</p>
        </div>
    </div>

    <div class="layui-form-item" style="margin-top:20px">
        <div class="layui-input-block">
            <button class="layui-btn layui-btn-normal" type="button" lay-submit="" lay-filter="savebtn"><i class="layui-icon">&#x1005;</i>开始发送</button>
        </div>
    </div>
    <input type="hidden" id="orderID" name="orderID" value="[[ o.orderId ]]" />
    <input type="hidden" id="type" name="type" value="0" />
    <input type="hidden" id="gameName" name="gameName" value="崩坏：星穹铁道" />
</form>

<script src="/JS2019/Order/sendsms.js?v=202110178" type="text/javascript"></script>
