<form class="layui-form layui-form-pane" action="" style="padding-top:20px;margin-left:10px;margin-right:10px">
    <div class="layui-form-item">
        <label class="layui-form-label">要改成：</label>
        <div class="layui-input-block">
                    <input type="radio" name="status" value="未分配" title="未分配" lay-filter="status">
                    <input type="radio" name="status" value="待上号" title="待上号" lay-filter="status">
                    <input type="radio" name="status" value="代练中" title="代练中" lay-filter="status">
                    <input type="radio" name="status" value="待验收" title="待验收" lay-filter="status">
                    <input type="radio" name="status" value="已完成" title="已完成" lay-filter="status">
                    <input type="radio" name="status" value="已暂停" title="已暂停" lay-filter="status">
                    <input type="radio" name="status" value="异常中" title="异常中" lay-filter="status">
                    <input type="radio" name="status" value="问题单" title="问题单" lay-filter="status">
                    <input type="radio" name="status" value="已退单" title="已退单" lay-filter="status">
                    <input type="radio" name="status" value="撤销中" title="撤销中(交易用)" lay-filter="status">
                    <input type="radio" name="status" value="仲裁中" title="仲裁中(交易用)" lay-filter="status">
                    <input type="radio" name="status" value="已撤销" title="已撤销(交易用)" lay-filter="status">
                    <input type="radio" name="status" value="已仲裁" title="已仲裁(交易用)" lay-filter="status">

        </div>
    </div>
    <div class="layui-form-item remark" style="display:none">
        <label class="layui-form-label">说明原因：</label>
        <div class="layui-input-block">
            <input type="text" name="remark" id="remark" autocomplete="off" placeholder="请输入原因" class="layui-input layui-input-shadow" maxlength="50">
        </div>
    </div>
    <div class="layui-form-item asnyTb" style="display:none">
        <label class="layui-form-label">同步淘宝发货</label>
        <div class="layui-input-block">
            <input type="radio" name="asnyTb" value="N" title="不需要" checked="checked">
            <input type="radio" name="asnyTb" value="Y" title="同步发货" >
        </div>
    </div>
    <div class="layui-form-item" style="margin-top:20px">
        <div class="layui-input-block">
            <button class="layui-btn layui-btn-normal savebtn" type="button" lay-submit="" lay-filter="savebtn"><i class="layui-icon">&#x1005;</i>确定</button>
        </div>
    </div>
    <input type="hidden" id="orderId" name="orderId" value="[[ o.orderId if o else "" ]]" />
    <input type="hidden" id="changeSoureType" name="changeSoureType" value="1" />
    <input type="hidden" id="mustRemark" name="mustRemark" value="Y" />
</form>
