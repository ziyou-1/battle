<form class="layui-form" action="">
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 100px">操作日期</label>
                <div class="layui-input-inline" style="width:110px">
                    <input type="text" name="sDate" id="sDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(31) ]]">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline" style="width:110px">
                    <input type="text" name="eDate" id="eDate" lay-verify="date" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 100px">操作动作</label>
                <div class="layui-input-inline">
                    <select id="actionSelect" name="actionSelect" lay-filter="">
                        <option value="-1">全部</option>
                        
                        <option value="1">发单</option>
                        <option value="2">改成问题单</option>
                        <option value="3">改成异常单</option>
                        <option value="4">改成已暂停</option>
                        <option value="5">申请撤销</option>
                        <option value="7">取消撤销</option>
                        <option value="8">同意撤销</option>
                        <option value="9">改价改时</option>
                        <option value="10">验收订单</option>
                        <option value="15">改成已退单</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 100px;padding:8px 8px">操作人员</label>
                <div class="layui-input-inline" style="">
                    <select name="recUser" id="recUser" lay-search="" xm-select="recUser" xm-select-radio xm-select-skin="default" xm-select-height="36px" xm-select-search="" xm-select-search-type="title">
                        <option value="">选择或输入</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 100px">单号搜索</label>
                <div class="layui-input-inline">
                    <input type="text" name="key1" id="key1" lay-verify="" placeholder="系统单号/交易单号" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 100px">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-row layui-col-space10">
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md9 layui-col-lg9">
            <fieldset class="layui-elem-field">
                <legend>操作明细</legend>
                <div class="layui-field-box">
                    <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
                    <script type="text/html" id="toolbarDemo">
                        <div class="layui-btn-container">
                            <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新数据</button>
                        </div>
                    </script>
                </div>
            </fieldset>          
        </div>
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md3 layui-col-lg3">
