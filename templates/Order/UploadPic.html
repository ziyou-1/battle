<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>

<style>
    .wrap{
        position:relative;
        width:100%;
    }
    .drop_area {
        border: 2px dashed #ccc;
        width: 100%;
        height:180px;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        cursor: pointer;
        box-sizing: border-box;
    }

    #fileInput {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 100;
        opacity: 0;
    }
    #uploadInput {
        line-height: 36px;
        border: 1px solid #ccc !important;
        position: relative;
        margin: 10px auto 0;
        font-size:18px
    }

    [contenteditable="true"]:focus {
        outline: none; 
    }
    .uploadTips {
        position: absolute;
        color: #999; /* 占位符颜色 */
        cursor: text;
        left: 10px;
        line-height: 36px;
        top: 0px;
        font-size:18px;
    }

    /* 聚焦时隐藏占位符（可选） */
    #uploadInput:focus::before {
        content: none;
    }
</style>
<form class="layui-form layui-form-pane" action="" style="padding-top:10px;margin-left:10px;margin-right:10px">
    <p style="color:#808080">
        提示：截图有效时间为90天，90天后将自动失效，如果出现上传不了，请多尝试几次，或每次上传数量少一点；群聊二维码仅限一张，再次上传会覆盖原二维码！
    </p>


    <fieldset class="layui-elem-field layui-field-title">
        <legend>请先点击上传图片，再点击保存</legend>
    </fieldset>
        <div class="layui-form-item">
            <label class="layui-form-label">图片类型：</label>
            <div class="layui-input-inline" style="width:70%">
                <input type="radio" name="imgType" value="0" title="订单截图" checked>
                <input type="radio" name="imgType" value="1" title="群聊二维码">
            </div>
        </div>
    <div class="layui-form-item">
        <label class="layui-form-label">图片备注：</label>
        <div class="layui-input-inline" style="width:70%">
            <input type="text" name="remark" id="remark" autocomplete="off" placeholder="可以给图片做个备注说明" class="layui-input layui-input-shadow" maxlength="50">
        </div>
    </div>
    <div class="layui-upload">
        <div class="wrap">
            <div style="position: absolute;height: 30px;width: 100%;">
                <div class="layui-progress layui-progress-big" lay-showPercent="yes" lay-filter="progressBar" id="progressBar" style="display:none;">
                    <div class="layui-progress-bar layui-bg-green" lay-percent="0%"></div>
                </div>
            </div>
            <div class="drop_area" id="drop_area">
                <i class="layui-icon layui-icon-addition" style="font-size: 50px;"></i>
                <div>将文件拖到此处，或<span class="upload-txt">点击上传图片文件</span></div>
            </div>
        </div>

        <div style="position: relative; width: 90%; margin: 0 auto;">
            <div class="uploadTips">点击此处可粘贴图片</div>
            <div id="uploadInput" contenteditable="true">
            </div>
        </div>


        <div>
            <button type="button" class="layui-btn layui-btn-danger w-md" lay-submit="" lay-filter="savebtn" style="width:100%;margin-top:10px"><i class="layui-icon layui-icon-upload-drag"></i>点我将上传的图片提交保存</button>
        </div>
        <div class="layui-upload-list">
            <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
            <script type="text/html" id="baroperating">
                <a class="layui-btn layui-btn-xs layui-btn-normal" style="" lay-event="viewPic" title="浏览图片"><i class="layui-icon layui-xiugaimima1"></i>浏览图片</a>
                <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="delitem" title="浏览图片"><i class="layui-icon layui-xiugaimima1"></i>删除</a>
            </script>
        </div>
        <p style="color:#ff6a00;margin-top:10px">提示：全部上传完成前，请勿关闭本界面。上传完成后请再浏览一次订单截图以确保全部上传成功！</p>
    </div>

    <input type="hidden" id="orderId" name="orderId" value="[[ o.orderId ]]" />
    <input type="hidden" id="gameAccId" name="gameAccId" value="0" />
    <input type="hidden" id="sid" name="sid" value="[[ sys.id ]]" />
    <input type="hidden" id="taskId" name="taskId" value="0" />

</form>
