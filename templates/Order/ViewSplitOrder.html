<form class="layui-form" action="">
    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon layui-refresh2"></i>刷新数据</button>
                <button class="layui-btn layui-btn-xs " lay-event="setRecMan" type="button" title="批量或单笔将订单指派给接手人"><i class="layui-icon layui-buchongiconsvg15"></i>指派接手</button>
                <button class="layui-btn layui-btn-xs " lay-event="changeStaBtn" type="button" title="批量或单笔更改订单状态"><i class="layui-icon layui-jibenxinxishezhi"></i>更改状态</button>
                <button class="layui-btn layui-btn-xs" lay-event="setOrderThrowHomeBtn" type="button" title="将指定订单放到内部接单大厅里让接手人自由领取"><i class="layui-icon layui-pingtai"></i>内部抛单</button>
                <button class="layui-btn layui-btn-xs " lay-event="cleanOrderThrowHomeBtn" type="button" title="将指定订单从内部接单大厅里撤销抛单"><i class="layui-icon layui-zuixiaohua"></i>内部撤单</button>

                <button class="layui-btn layui-btn-xs" lay-event="setJiWei" type="button" title="批量或单笔设定订单的所在机位或机器"><i class="layui-icon layui-bangdingshebei"></i>设定机位</button>

                <button class="layui-btn layui-btn-xs" lay-event="setOrderTipsBtn" type="button" title="将指定订单打个标记"><i class="layui-icon layui-biaoji"></i>设置标记</button>
                <button class="layui-btn layui-btn-xs" lay-event="cleanOrderTipsBtn" type="button" title="将指定订单的标记清除"><i class="layui-icon layui-qingchuhuancun2"></i>清除标记</button>
                <button class="layui-btn layui-btn-xs" lay-event="setOrderJiajiBtn" type="button" title="将指定订单设置加急标记或清除加急标记"><i class="layui-icon layui-shandian"></i>订单加急</button>
                <button class="layui-btn layui-btn-xs" lay-event="sendSmsBtn" type="button" title="给指定订单的客户发送手机短信"><i class="layui-icon layui-duanxin"></i>发送短信</button>

                <button class="layui-btn layui-btn-xs" lay-event="delOrderBtn" type="button" title="将指定订单删除（谨慎操作）"><i class="layui-icon layui-icon-delete"></i>删除订单</button>
            </div>
            <div style="color:#ff6a00" id="total"></div>
        </script>
    </div>

    <input type="hidden" id="isNewPage" name="isNewPage" value="N" />
    <input type="hidden" id="isInvoFee" name="isInvoFee" value="Y" />
    <input type="hidden" id="gameName" name="gameName" />
    <input type="hidden" id="splitId" name="splitId" value="[[ o.orderId if o else "" ]]" />
</form>
