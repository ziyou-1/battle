                                            <div class="layui-input-block">

                                                <blockquote class="layui-elem-quote" style="padding:8px;margin-top:10px">

                                                            [% if not o %][% if not o %]<a lay-href="/System/autodiscernset" lay-text="订单识别关键词设置" lay-tips="订单内容里有识别不了的内容，可以进入这里进行关键词设置" style="color:#ff6a00">

                                            </div>
                                        </div>
                                    </div>
                                </div>

                                        </div>

[% for gm in games %]<option value="[[ gm.gameId ]]" data-mobliegame="[[ gm.isMoblieGame ]]" data-pw="[[ gm.isPw ]]" data-accpwd="[[ 'N' if gm.isNotAccPwd == 'Y' else 'Y' ]]"[% if o and o.gameId == gm.gameId %] selected='selected'[% endif %]>[[ gm.gameName ]]</option>[% endfor %]
</select>
