<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>客户评价</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/layuiadmin/layui/css/layui.css?V=128102" media="all">
    <link rel="stylesheet" href="/layuiadmin/style/admin.css" media="all">
    <link rel="stylesheet" href="/CSS/zdy.css?v=1100008" media="all" />
<link rel="stylesheet" href="/CSS/admin-skin.css?v=3" media="all" />
    <script src="/layuiadmin/layui/layui.js?V=110293266"></script>
    <script type="text/javascript" src="/JS2019/common.js?v=11107"></script>
    <style>body { background-color: #fff } .stars { color: #FFB800; letter-spacing: 1px }</style>
</head>
<body>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body">
            <form class="layui-form" lay-filter="search" onsubmit="return false">
                <div class="layui-form-item" style="margin-bottom:0">
                    <div class="layui-inline"><div class="layui-input-inline"><select name="stars" lay-filter="stars"><option value="0">全部星级</option><option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option><option value="2">2 星</option><option value="1">1 星</option></select></div></div>
                    <div class="layui-inline"><div class="layui-input-inline"><input type="text" name="key" id="key" class="layui-input" placeholder="订单号 / 客户 / 打手 / 内容" autocomplete="off"></div></div>
                    <div class="layui-inline"><button class="layui-btn layui-btn-normal" lay-submit lay-filter="seach">搜索</button></div>
                    <div class="layui-inline layui-word-aux" id="summary"></div>
                </div>
            </form>
            <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
            <script type="text/html" id="bar"><a class="layui-btn layui-btn-xs" lay-event="reply">{{ d.reply ? '修改回复' : '回复' }}</a></script>
        </div>
    </div>
</div>
<script>
    layui.config({ base: '../layuiadmin/' }).extend({ index: 'lib/index' }).use(['index', 'form', 'table', 'layer'], function () {
        var $ = layui.$, form = layui.form, table = layui.table, layer = layui.layer, stars = 0;
        var tableList = table.render({
            elem: '#tableList', url: '/OrderAjax/GetClientReviewList', page: true, limit: 30,
            cols: [ [
                { field: 'createTime', title: '评价时间', width: 140 },
                { field: 'orderNo', title: '订单号', width: 150 },
                { field: 'customerName', title: '客户', width: 110 },
                { field: 'gameName', title: '游戏', width: 120 },
                { field: 'project', title: '项目', minWidth: 160 },
                { field: 'recManName', title: '打手', width: 100 },
                { field: 'stars', title: '星级', width: 110, templet: function (d) { return '<span class="stars">' + '★'.repeat(d.stars) + '☆'.repeat(5 - d.stars) + '</span>'; } },
                { field: 'content', title: '评价内容', minWidth: 220 },
                { field: 'reply', title: '商家回复', minWidth: 180, templet: function (d) { return d.reply ? d.reply + '<span class="layui-word-aux">（' + (d.replyUser || '') + '）</span>' : '<span class="layui-word-aux">未回复</span>'; } },
                { title: '操作', width: 90, toolbar: '#bar', fixed: 'right' }
            ] ],
            done: function (res) { if (res.total) $('#summary').html('共 ' + res.total.count + ' 条，平均 ' + res.total.avg + ' 星，好评（4 星以上）' + res.total.good + ' 条'); }
        });
        function reload() { tableList.reload({ where: { stars: stars, key: $('#key').val() }, page: { curr: 1 } }); }
        form.on('select(stars)', function (d) { stars = d.value; reload(); });
        form.on('submit(seach)', function () { reload(); return false; });
        table.on('tool(tableList)', function (obj) {
            if (obj.event === 'reply') {
                layer.prompt({ title: '回复客户（客户端可见）', formType: 2, value: obj.data.reply || '', maxlength: 300 }, function (val, index) {
                    $.post('/OrderAjax/ReplyClientReview', { id: obj.data.id, reply: val }, function (res) { layer.msg(res.msg); if (res.code > 0) { layer.close(index); tableList.reload(); } }, 'json');
                });
            }
        });
    });
</script>
</body>
</html>
