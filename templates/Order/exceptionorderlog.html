                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label" style="width: 100px">游戏查询</label>

                                    <select id="gameName" name="gameName" lay-filter="gameName">
                                                    <option value="">全部游戏</option>
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]


                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-inline">
                            
                            <div class="layui-input-inline" style="width: 100px; margin-right: -2px;">

                                    <option value="0">接手时间</option>
                                    <option value="1">异常时间</option>
                                </select>
                            </div>
                            <div class="layui-input-inline" style="width:140px">
                                <input type="text" name="start" id="sDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(184) ]]">
                            </div>
                            <div class="layui-input-inline">-</div>
                            <div class="layui-input-inline" style="width:140px">
                                <input type="text" name="end" id="eDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label" style="width: 100px">异常原因</label>
                            <div class="layui-input-inline">
                                <select name="type" id="type" lay-verify="">

                                    <option value="0">删除订单</option>

                                    <option value="3">中途退单</option>
                                </select>
                            </div>
                        </div>
