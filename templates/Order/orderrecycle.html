<form class="layui-form" action="" lay-filter="fm">
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">游戏名称</label>
                <div class="layui-input-inline" style="">
                    <select id="gameName" name="gameName" lay-filter="selectGame">
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]


                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">订单状态</label>
                <div class="layui-input-inline" style="">
                    <select id="orderSta" name="orderSta">
                        <option value="">全部</option>
                        <option value="未分配">未分配</option>
                        <option value="待上号">待上号</option>
                        <option value="代练中">代练中</option>
                        <option value="待验收">待验收</option>
                        <option value="已完成">已完成</option>
                        <option value="问题单">问题单</option>
                        <option value="已暂停">已暂停</option>
                        <option value="已退单">已退单</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">删除时间</label>
                <div class="layui-input-inline" style="width: 180px;">
                    <input type="text" name="sDate" id="sDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(62) ]] 00:00:00">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline" style="width: 180px;">
                    <input type="text" name="eDate" id="eDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]] 23:59:59">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 90px">订单来源</label>
                <div class="layui-input-inline" style="">
                    <select name="orderSoures" id="orderSoures" xm-select-radio lay-search="" xm-select="orderSoures" xm-select-search="" xm-select-search-type="title" xm-select-skin="default" xm-select-height="36px" class="" title=""></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">搜索1</label>
                <div class="layui-input-inline">
                    <input type="text" name="key1" id="key1" lay-verify="" placeholder="订单号/角色名/手机号" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">游戏账号</label>
                <div class="layui-input-inline">
                    <input type="text" name="gameAcc" id="gameAcc" lay-verify="" placeholder="可输入游戏账号搜索" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
                <button class="layui-btn layui-btn-xs" lay-event="refOrder" type="button" title="批量还原钩选的订单">批量还原钩选的订单</button>
            </div>
            <div style="color:#ff6a00" id="total"></div>
        </script>

        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="refOrder"><i class="icon larry-icon larry-toast"></i>还原该订单</a>
        </script>
    </div>
    <input type="hidden" name="minD" id="minD" value="[[ minD ]]" />
    <input type="hidden" name="maxD" id="maxD" value="[[ maxD ]]" />
</form>
<script src="/JS2019/Order/orderrecycle.js?v=20260427" type="text/javascript"></script>
