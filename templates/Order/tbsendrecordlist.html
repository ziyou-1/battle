<form class="layui-form" action="">
    <div class="layui-form-pane" style="margin-top:10px">
        <div class="layui-inline">
            <label class="layui-form-label" style="width: 80px">发货时间</label>
            <div class="layui-input-inline">
                <input type="text" name="sDate" id="sDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(2) ]]">
            </div>
            <div class="layui-input-inline">-</div>
            <div class="layui-input-inline">
                <input type="text" name="eDate" id="eDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
            </div>
        </div>


        <div class="layui-inline">
            <label class="layui-form-label" style="width: 80px">发货结果</label>
            <div class="layui-input-inline">
                <select id="result" name="result">
                    <option value="-1" selected="selected">全部</option>
                    <option value="1">成功</option>
                    <option value="0">失败</option>
                </select>
            </div>
        </div>


        <div class="layui-inline">
            <label class="layui-form-label" style="width: 80px">搜索</label>
            <div class="layui-input-inline">
                <input type="text" name="key" id="key" lay-verify="" placeholder="系统单号/淘宝单号" autocomplete="off" class="layui-input layui-input-shadow" value="">
            </div>
        </div>

        <div class="layui-inline">
            <div class="layui-input-inline" style="">
                <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
            </div>
        </div>
    </div>

    <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon layui-refresh2"></i>刷新数据</button>
            <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="send" type="button" title="重新发货一次"><i class="layui-icon layui-refresh2"></i>重试发货</button>
            <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="import" type="button" title="导入txt文件进行批量发货"><i class="layui-icon layui-refresh2"></i>导入文件发货</button>
        </div>
        <div style="color:#ff6a00" id="total"></div>
    </script>

    <table class="layui-hide" id="tableList" lay-filter="tableList"></table>

    <div class="" id="hidDiv" style="display:none">
        <blockquote class="layui-elem-quote">
            请上传TXT文件，每行一个淘宝单号，不要有任何标点符号
        </blockquote>
        <div class="layui-input-block hide-c" style="margin-top:50px;">
            <label class="layui-form-label" style="width: auto;text-align: center; font-size: 14px;">订单来源</label>
            <div class="layui-input-inline">
                <select id="source" name="source" lay-filter="">
                    <option value=""></option>
                            <option value="订单来源错误">订单来源错误</option>
                            <option value="云序工作室淘宝店">云序工作室淘宝店</option>
                            <option value="小小优优">小小优优</option>
                            <option value="西片同学">西片同学</option>
                            <option value="归山的小铺子">归山的小铺子</option>
                            <option value="野原的小店">野原的小店</option>
                            <option value="椎名真白">椎名真白</option>
                            <option value="幽幽子">幽幽子</option>
                            <option value="蝶野雏">蝶野雏</option>
                            <option value="北白川玉子">北白川玉子</option>
                            <option value="藤原千花">藤原千花</option>
                            <option value="玛露西尔">玛露西尔</option>
                            <option value="天野阳菜">天野阳菜</option>
                            <option value="宫水三叶">宫水三叶</option>

                </select>
            </div>
            <div class="layui-input-inline">
                <button type="button" class="layui-btn" id="btnCheck" style="margin-left:50px">
                    <i class="layui-icon">&#xe67c;</i>上传txt文件
                </button>
                <button type="button" class="layui-btn layui-hide" id="btnImport">
                    <i class="layui-icon">&#xe67c;</i>上传txt文件
                </button>
            </div>
        </div>
    </div>

</form>
