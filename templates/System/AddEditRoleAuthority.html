<style>
    .chengeRole ul {
        margin: 0 0 0 30px
    }
    .chengeRole ul li p {
            margin: 0;
        }
    .chengeRole ul li {
            list-style-type: none;
            font-size: 14px;
            line-height: 32px;
            color: #333333;
        }
    .chengeRole ul li span {
                cursor: pointer;
                padding: 0 0 0 22px;
                background-image: url(../images/icon_select.png);
                background-repeat: no-repeat;
                margin: 0 30px 0 0;
                background-position: 3px 4px;
                line-height: 32px;
            }
    .chengeRole ul li span.selected {
                    background-position: 3px -31px;
                }

<form class="layui-form" action="">
    <div class="layui-form-pane" style="margin-top:10px;margin-left:10px">
        <div class="layui-form-item">
            <label class="layui-form-label">角色职位名称</label>
            <div class="layui-input-block">
                <input type="text" name="title" id="title" lay-verify="required" autocomplete="off" placeholder="该角色职位的名称" maxlength="5" class="layui-input layui-input-shadow boxshadow-success" value="[[ role.roleName if role else '' ]]">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色说明</label>
            <div class="layui-input-block">
                <input type="text" name="remark" id="remark" lay-verify="" autocomplete="off" placeholder="对该角色的作用描述" maxlength="50" class="layui-input layui-input-shadow boxshadow-success" value="[[ role.remark if role else '' ]]">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">设置其权限</label>
            <div class="layui-input-block">

                <div class="chengeRole">
                    <ul class="setNav"></ul>
                </div>

            </div>
        </div>
        <div style="text-align:center;align-items:center">
            <button type="button" class="layui-btn   layui-btn-normal layui-btn-lg" lay-submit="" lay-filter="savebtn">保存</button>
        </div>
    </div>
    <input type="hidden" name="roleId" id="roleId" value="[[ role.id if role else 0 ]]" />
    <input type="hidden" name="menuId" id="menuId" value="[[ role.id if role else 0 ]]" />
</form>
