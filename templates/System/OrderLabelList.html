<form class="layui-form" action="" lay-filter="form">
    <div class="" style="padding-top:10px;margin-bottom:15px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">指定游戏</label>
                <div class="layui-input-inline">
                    <select id="gameName" name="gameName" lay-filter="selectGame">
                        <option value="">全部游戏</option>
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]

                                    <option value="伊莫">伊莫</option>
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]


                    </select>
                </div>
            </div>
        </div>
    </div>

    <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
    <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" lay-tips="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
            <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="addBtn" type="button" lay-tips="新增一个订单标签"><i class="layui-icon layui-icon-add-1"></i>新增一个订单标签</button>
        </div>
    </script>
    <script type="text/html" id="baroperating">
        <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="submitEdit" lay-tips="编辑标签"><i class="layui-icon layui-icon-edit"></i>修改</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="submitDel" lay-tips="删除该标签"><i class="layui-icon layui-icon-delete"></i>删除</a>
    </script>
    <script type="text/html" id="switchTpl1">
        <input type="checkbox" name="doNotSendSms" value="{{d.id}}" lay-skin="switch" lay-text="启用|禁用" lay-filter="doNotSendSms" {{ d.labelStatus== 1 ? '' : 'checked' }}>
    </script>

    <div class="change" style="display:none;padding:10px 10px">
        <div class="layui-form-item" style="">
            <label class="layui-form-label">指定游戏用</label>
            <div class="layui-input-block">
                <select id="labelGame" name="labelGame">
                    <option value="">全部游戏</option>
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]

                            <option value="伊莫">伊莫</option>
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]


                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">标签名称</label>
            <div class="layui-input-block">
                <input type="text" name="labelName" id="labelName" lay-verify="" autocomplete="off" placeholder="请输入标签名称" maxlength="20" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">标签描述</label>
            <div class="layui-input-block">
                <input type="text" name="labelRemark" id="labelRemark" lay-verify="" autocomplete="off" placeholder="对该标签的描述" maxlength="50" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">关键词匹配</label>
            <div class="layui-input-block">
                <input type="text" name="keywords" id="keywords" lay-verify="" autocomplete="off" lay-tips="多个关键词时使用,分隔" placeholder="请输入关键词，多个使用逗号分隔" maxlength="500" class="layui-input layui-input-shadow boxshadow-success" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">排序数值</label>
            <div class="layui-input-block">
                <input type="text" name="labelOrderBy" id="labelOrderBy" lay-verify="" lay-tips="数值越大越靠前，请输入整数，最小0" autocomplete="off" placeholder="数值越大越排前面，整数" maxlength="3" class="layui-input layui-input-shadow boxshadow-success" value="0">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">标签颜色</label>
            <div class="layui-input-block">
                <div class="layui-input-inline" style="width: 120px;">
                    <input type="text" name="labelColor" value="" placeholder="请选择颜色" class="layui-input" id="labelColor">
                </div>
                <div class="layui-inline" style="left: -11px;">
                    <div id="ID-colorpicker-demo-form"></div>
                </div>
            </div>
        </div>    
    <div style="text-align:center;align-items:center;margin-top:20px">
        <div class="layui-input-inline">
            <button class="layui-btn layui-btn-normal layui-btn-lg w-lg" id="saveBtn" lay-submit="" type="button" lay-filter="savebtn" style="">提交保存</button>
        </div>
    </div>
    </div>
    <input type="hidden" id="labelId" name="labelId" value="" />
</form>
