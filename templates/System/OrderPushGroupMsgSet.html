<style>
    .layui-form-pane .layui-form-label {
        width: 110px;
        padding: 8px 8px;
        height: 38px;
        line-height: 20px;
        border-width: 1px;
        border-style: solid;
        border-radius: 2px 0 0 2px;

        cursor: pointer;
        color: #1485EE;

<form class="layui-form" action="" lay-filter="form">
    <blockquote class="layui-elem-quote" style="font-size:14px">
        <p style="font-weight:600">功能介绍：</p>
        <p>客户在企业微信内部群创建群机器人，复制 Webhook 地址到下方。选择游戏和发送时机后，新订单录入或订单状态变更将自动推送。发送结果会在列表中显示。</p>
    </blockquote>

    <div class="layui-elem-field">
        <legend style="margin-top:10px">企业微信群消息推送设置</legend>
        <div class="layui-field-box">
            <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
            <script type="text/html" id="switchTpl1">
                <input type="checkbox" name="status" value="{{d.id}}" lay-skin="switch" lay-text="启用|禁用" lay-filter="staChecked" {{ d.switchStatus == 'Y' ? 'checked' : '' }}>
            </script>
            <script type="text/html" id="toolbarDemo">
                <div class="layui-btn-container">
                    <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
                    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="addBtn" type="button" title="新增一个自动发消息到群"><i class="layui-icon layui-icon-add-1"></i>新增一个</button>
                </div>
            </script>
            <script type="text/html" id="baroperating">
                <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="submitEdit" title="编辑参数"><i class="layui-icon layui-icon-edit"></i>修改</a>
                <a class="layui-btn layui-btn-xs" lay-event="history" title="查看发送记录">记录</a>
                {{# if(d.lastDeliveryFailed){ }}<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="retry" title="重试最近一条发送失败的消息">重试</a>{{# } }}
                <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="submitDel" title="删除该条"><i class="layui-icon layui-icon-delete"></i>删除</a>
            </script>
        </div>
    </div>


    <div class="modifyParamDiv" style="display:none">
        <blockquote class="layui-elem-quote">
            <span>根据实际需要，请在下面配置</span>
        </blockquote>
        <div class="layui-form-pane" style="">
            <div class="layui-form-item">
                <label class="layui-form-label">限定游戏</label>
                <div class="layui-input-block">
[% for gm in games_real %]<input type="checkbox" name="gameName" value="[[ gm.gameName ]]" title="[[ gm.gameName ]]" />[% endfor %]
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">WebhookUrl</label>
                <div class="layui-input-block">
                    <input type="password" name="webhookUrl" id="webhookUrl" lay-verify="" autocomplete="off" placeholder="粘贴企业微信群机器人 Webhook；修改时留空保持原值" maxlength="300" class="layui-input layui-input-shadow boxshadow-success" value="">
                </div>
            </div>
            <div class="layui-form-item" style="color:#777;padding-left:12px">使用客户企业微信群机器人 Webhook；原平台内部群聊 ID 不适用于本地系统。</div>
            <div class="layui-form-item">
                <label class="layui-form-label">发送时机</label>
                <div class="layui-input-block">
                    <input type="radio" name="replyOcc" value="0" title="新订单录入时">
                    <input type="radio" name="replyOcc" value="30" title="订单状态变更时">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">是否@全员</label>
                <div class="layui-input-block">
                    <input type="radio" name="callAll" value="0" title="需要">
                    <input type="radio" name="callAll" value="10" title="不需要">
                </div>
            </div>
            <div class="layui-form-item layui-hide">
                <label class="layui-form-label">快捷抢单链接</label>
                <div class="layui-input-block">
                    <input type="radio" name="kurl" value="0" title="不需要" checked="checked">
                    <input type="radio" name="kurl" value="10" title="<span lay-tips='在消息末尾追加此单抢单URL地址'>需要</span>">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">消息类型</label>
                <div class="layui-input-block">
                    <input type="radio" name="msgType" value="0" title="MarkDown模式" checked="checked">
                    <div lay-radio><span lay-tips="默认情况下请选这个">MarkDown模式</span></div>
                    <input type="radio" name="msgType" value="1" title="文本模式">
                    <div lay-radio><span lay-tips="特殊情况下选这个">文本模式</span></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">追加备注</label>
                <div class="layui-input-block">
                    <input type="text" name="remark" id="remark" lay-verify="" autocomplete="off" placeholder="" maxlength="100" class="layui-input layui-input-shadow boxshadow-success" value="">
                </div>
            </div>
        </div>
        <div style="text-align:center;align-items:center">
            <a class="layui-btn layui-btn-normal layui-btn-lg w-lg saveBtn">保存设置</a>
        </div>
    </div>

    <input type="hidden" name="ptid" id="ptid" />
</form>
<script src="/JS2019/System/OrderPushGroupMsgSet.js?v=20260924" type="text/javascript"></script>



</body>
</html>
