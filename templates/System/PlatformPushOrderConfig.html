<form class="layui-form" action="" lay-filter="form">
    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>       
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="settconfig" type="button" title="批量配置默认发单参数"><i class="layui-icon">&#xe669;</i>批量配置默认发单参数</button>
            </div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-normal" style="margin-right:3px" lay-event="submitEdit" title="点击我可以配置这款游戏的默认发单参数"><i class="layui-icon layui-icon-edit"></i>配置参数</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="submitDel" title="将此游戏的默认发单配置清空"><i class="layui-icon layui-icon-delete"></i>清空</a>
        </script>
    </div>

    <div class="modifyParamDiv" style="display:none">
        <blockquote class="layui-elem-quote">
            <span style="font-size:14px">您需要先对接交易平台，对接好后再配置以下参数，就能在录单页面进行快速发单到交易平台了</span>
        </blockquote>
        <div class="layui-form-pane" style="">
            <div class="layui-form-item">
                <label class="layui-form-label">默认发单平台</label>
                <div class="layui-input-block">


                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">发单联系电话</label>
                <div class="layui-input-block">
                    <input type="text" name="pushorderphone" id="pushorderphone" lay-verify="" autocomplete="off" placeholder="输入打手能联系到您的电话" maxlength="50" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">发单联系QQ</label>
                <div class="layui-input-block">
                    <input type="text" name="pushorderqq" id="pushorderqq" lay-verify="" autocomplete="off" placeholder="输入打手能联系到您的QQ" maxlength="50" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">发单价比例</label>
                <div class="layui-input-block">
                    <input type="text" name="pushorderpricescale" id="pushorderpricescale" lay-verify="" autocomplete="off" placeholder="可以设定一个根据接单价自动生成发单价的比例" class="layui-input" lay-tips="如果你需要让系统根据接单价按照你设定的百分百来自动计算发单价，请在这里输入百分比数值，不要带百分号。如果填0就代表不计算默认发单价" style="cursor:text" value="0">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">安全保证金</label>
                <div class="layui-input-block">
                    <input type="text" name="pushordersafeamount" id="pushordersafeamount" lay-verify="" autocomplete="off" placeholder="发单时默认的安全保证金" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">效率保证金</label>
                <div class="layui-input-block">
                    <input type="text" name="pushordereffamount" id="pushordereffamount" lay-verify="" autocomplete="off" placeholder="发单时默认的效率保证金" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">填写玩家电话</label>
                <div class="layui-input-block">
                    <input type="radio" name="autowritephone" value="0" title="根据订单电话自动填写" checked="checked">
                    <input type="radio" name="autowritephone" value="1" title="留空">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">自动生成虚拟号</label>
                <div class="layui-input-block">
                    <input type="radio" name="autobuilderprivtephone" value="0" title="不生成">
                    <input type="radio" name="autobuilderprivtephone" value="1" title="生成">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">要求和说明</label>
                <div class="layui-input-block">
                    <textarea id="pushorderquire" name="pushorderquire" placeholder="可以将针对此游戏的代练陪玩要求写在此处，发单时将默认用这个要求内容" class="layui-textarea" style="height:180px" maxlength="450"></textarea>
                </div>
            </div>

        </div>
        <div style="text-align:center;align-items:center">
            <a class="layui-btn layui-btn-normal layui-btn-lg w-lg saveInterfaceBtn">保存设置</a>
        </div>
    </div>

</form>
