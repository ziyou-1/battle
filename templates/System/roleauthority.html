        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="submitEdit" title="编辑权限"><i class="layui-icon layui-icon-edit"></i>修改权限</a>
            <a class="layui-btn layui-btn-xs" style="" lay-event="submitcopy" title="复制为新职位"><i class="layui-icon layui-icon-file-b"></i>复制职位</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="" lay-event="submitDel" title="删除该角色职位"><i class="layui-icon layui-icon-delete"></i>删除职位</a>
        </script>

    <div class="copyRole" style="display:none">
        <div class="layui-row">
            <div class="layui-form-item">
                <label class="layui-form-label">当前角色职位名称：</label>
                <div class="layui-input-block">
                    <input type="text" name="currole" id="currole" disabled class="layui-input layui-input-shadow">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">新角色职位名称：</label>
                <div class="layui-input-block">
                    <input type="text" name="jobName" id="jobName" autocomplete="off" placeholder="新角色职位名称" class="layui-input layui-input-shadow" maxlength="6">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">角色职位说明：</label>
                <div class="layui-input-block">
                    <textarea name="remark" id="remark" placeholder="请输入角色职位说明" class="layui-textarea" maxlength="50"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="copysubbtn" style="width: 80px">提交</button>
                </div>
            </div>
            <input type="hidden" name="currentJobId" class="currentJobId" value="0" />
        </div>
    </div>
