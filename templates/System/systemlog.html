<style type="text/css">
    .layui-table-cell {
        height: 40px;
        line-height: 40px;

<form class="layui-form" action="" lay-filter="form">
    <div class="" style="padding-left: 5px;padding-top:10px">
        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">游戏筛选</label>
                <div class="layui-input-inline" style="width: 120px">
                    <select id="gameName" name="gameName">
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]


                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">记录日期</label>
                <div class="layui-input-inline">
                    <input type="text" name="sDate" id="sDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(1) ]] 00:00:00">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline">
                    <input type="text" name="eDate" id="eDate" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]] 23:59:59">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 110px">日志分类</label>
                <div class="layui-input-inline">
                    <select name="logType" id="logType">
                        <option value="0">全部</option>
                        <option value="10">订单相关</option>
                        <option value="20">绩效相关</option>
                        <option value="30">用户相关</option>
                        <option value="40">系统相关</option>
                        <option value="50">会员相关</option>
                        <option value="60">排团相关</option>
                        <option value="5">号库相关</option>
                        <option value="70">其它</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 110px">相关人员</label>
                <div class="layui-input-inline">
                    <select name="recUser" id="recUser" lay-search="" xm-select-radio xm-select="recUser" xm-select-skin="default" xm-select-height="36px" xm-select-search="" xm-select-search-type="title">
                        <option value="">选择或输入</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 110px">系统订单号</label>
                <div class="layui-input-inline">
                    <input type="text" name="key2" id="key2" lay-verify="" placeholder="请输入系统订单号" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 110px">搜索关键词</label>
                <div class="layui-input-inline">
                    <input type="text" name="key1" id="key1" lay-verify="" placeholder="事项关键词" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>
        </div>
    </div>
    <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
    <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新列表</button>
            <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="clearAll" type="button" title="清空所有系统操作日志（不可恢复）"><i class="layui-icon">&#xe640;</i>清理全部日志</button>
        </div>
    </script>  
    <input type="hidden" id="id" name="id" value="" />
</form>  

<script src="/JS2019/System/systemlog.js?v=20260427" type="text/javascript"></script>
