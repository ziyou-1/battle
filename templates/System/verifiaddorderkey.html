<form class="layui-form" action="" lay-filter="dis" style="margin:10px 10px">
    <blockquote class="layui-elem-quote" style="color: #2f363c ">
        本功能作用：您可以设置同一个游戏下，针对代练项目、职业等项目做录单时的自动匹配修正关键词，便于将不规范的订单内容统一化。例如魔兽世界里，不同的商家针对代练项目有不同的写法，你可以自行规范它们，
        使得它们在录单时按照您的方式来，每一项可以设置5个。
    </blockquote>
    <div class="layui-form-item" style="width:300px">
        <label class="layui-form-label">所属游戏</label>
        <div class="layui-input-block">
            <select id="selectGame" name="selectGame" lay-filter="selectGame">
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]

                            <option value="伊莫">伊莫</option>
[% for gm in games %]<option value="[[ gm.gameName ]]">[[ gm.gameName ]]</option>[% endfor %]


            </select>
        </div>
    </div>
    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据">刷新列表</button>
                <button class="layui-btn layui-btn-danger layui-btn-xs" lay-event="resetBtn" type="button" title="重置所有数据为初始状态">重置列表</button>
            </div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-warm" style="" lay-event="submitEdit" title="修改关键词"><i class="layui-icon layui-icon-edit"></i>修改关键词</a>
        </script>
    </div>

    <div class="change" style="display:none">
        <div class="layui-form-pane" style="margin-top:10px;margin-left:10px;margin-right:10px">
            <div class="layui-form-item">
                <label class="layui-form-label" style="padding:8px 8px">关键词用*号分隔</label>
                <div class="layui-input-block">
                    <input type="text" name="key" id="key" lay-verify="" autocomplete="off" placeholder="要检测的关键词，每个关键词之间用*号分隔" maxlength="50" class="layui-input layui-input-shadow boxshadow-success" value="">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">统一修正为</label>
                <div class="layui-input-block">
                    <input type="text" name="resultStr" id="resultStr" lay-verify="" autocomplete="off" placeholder="统一修正为什么内容" maxlength="50" class="layui-input layui-input-shadow boxshadow-success" value="">
                </div>
            </div>
        </div>

        <div style="text-align:center;align-items:center">
            <div class="layui-input-inline">
                <button class="layui-btn layui-btn-normal layui-btn-lg w-lg" id="saveBtn" lay-submit="" type="button" lay-filter="savebtn" style="">保存设定</button>
            </div>
        </div>
    </div>
    <input type="hidden" id="disID" name="disID" value="" />
</form>
