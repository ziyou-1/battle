<form class="layui-form" action="" lay-filter="sform" style="background-color:#fff">
    <div class="" style="padding-left: 5px;padding-top:10px">

        <div class="layui-form-pane">
            <div class="layui-inline">
                <label class="layui-form-label">姓名搜索</label>
                <div class="layui-input-inline">
                    <input type="text" name="name" id="name" lay-verify="" placeholder="输入姓名搜索" autocomplete="off" class="layui-input layui-input-shadow" value="">
                </div>
            </div>



            <div class="layui-inline">
                <label class="layui-form-label">手机号</label>
                <div class="layui-input-inline">
                    <input type="text" name="phone" id="phone" lay-verify="" placeholder="输入手机号" autocomplete="off" class="layui-input layui-input-shadow" value="">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">申请时间</label>
                <div class="layui-input-inline">
                    <input type="text" name="start" id="start" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(31) ]]">
                </div>
                <div class="layui-input-inline">-</div>
                <div class="layui-input-inline">
                    <input type="text" name="end" id="end" lay-verify="datetime" placeholder="" autocomplete="off" class="layui-input" value="[[ dago(0) ]]">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>
        </div>


    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据">刷新列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="copy" type="button" title="点击复制申请表单链接">复制邀请链接</button>
            </div>
        </script>
    </div>

    <script type="text/html" id="table_tool">
        <div class="layui-clear-space">
            {{#  if(d.status =='0'||d.status =='2'){ }}
            <a class="layui-btn layui-btn-xs" style="margin-right:0px" lay-event="submitEdit" lay-tips="点击通过申请">通过申请</a>
            {{#  } }}
            {{#  if(d.status =='0'){ }}
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="margin-left:10px" lay-event="submitRestPwd" lay-tips="点击驳回申请">驳回申请</a>
            {{#  } }}
            {{#  if(d.status =='0'||d.status =='2'){ }}
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="margin-left:10px" lay-event="delete" lay-tips="删除指定申请，慎用！">删除申请</a>
            {{#  } }}
        </div>
    </script>


</form>
