<form class="layui-form" action="" lay-filter="form">
    <div class="" style="padding-left: 5px;padding-top:10px">

        <div class="layui-form-pane"> 
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 80px">搜索词</label>
                <div class="layui-input-inline" style="width:300px">
                    <input type="text" name="key" id="key" lay-verify="" placeholder="手机号/QQ/微信号/名称/YY/收款账号" autocomplete="off" class="layui-input layui-input-shadow" value="">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal sechbtn" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>
        </div>


    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon layui-refresh" />刷新列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-normal" style="margin-right:5px" lay-event="addBackListBtn" type="button" title="手动新增一个黑名单"><i class="layui-icon layui-heimingdan1" />添加一个黑名单用户</button>
                <button class="layui-btn layui-btn-xs layui-btn-warm" style="margin-right:5px" lay-event="delBackBtn" type="button" title="从黑名单里移除指定用户"><i class="layui-icon layui-shanchu" />删除</button>
            </div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs" style="margin-right:0px" lay-event="submitEdit" title="编辑黑名单资料">编辑</a>
        </script>
    </div>

    <div class="addmodiftyDiv" style="display:none;padding:10px 10px">
        <blockquote class="layui-elem-quote layui-text">
            可以将手机号、微信号、QQ号等任意一个添加到黑名单内。添加到黑名单的用户，将无法给TA开系统子账号
        </blockquote>
        <div class="layui-form-item">
            <label class="layui-form-label">电话号码</label>
            <div class="layui-input-block">
                <input type="tel" name="moblie" id="moblie" placeholder="请输入手机号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="11">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">微信号</label>
            <div class="layui-input-block">
                <input type="tel" name="wechat" id="wechat" placeholder="请输入微信号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="30">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">QQ</label>
            <div class="layui-input-block">
                <input type="tel" name="qq" id="qq" placeholder="请输入QQ号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="30">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">名称(非匹配)</label>
            <div class="layui-input-block">
                <input type="tel" name="rname" id="rname" placeholder="请输入名称，此项不做匹配" autocomplete="off" class="layui-input layui-input-shadow" maxlength="30">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">身份证号</label>
            <div class="layui-input-block">
                <input type="tel" name="cid" id="cid" placeholder="" autocomplete="off" class="layui-input layui-input-shadow" maxlength="18">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">YY</label>
            <div class="layui-input-block">
                <input type="tel" name="yy" id="yy" placeholder="YY号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="32">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">收款账号</label>
            <div class="layui-input-block">
                <input type="tel" name="alipayacc" id="alipayacc" placeholder="这用户收款的账号" autocomplete="off" class="layui-input layui-input-shadow" maxlength="32">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">原因或备注</label>
            <div class="layui-input-block">
                <input type="text" name="remark" id="remark" lay-verify="" maxlength="100" autocomplete="off" placeholder="请尽可能写清列入黑名单的原因，可空" class="layui-input layui-input-shadow">
            </div>
        </div>
        <div style="text-align:center;align-items:center">
            <a href="javascript:(0)" class="layui-btn layui-btn-normal layui-btn-lg saveAddModifyBtn">保存</a>
        </div>
    </div>
    
</form>
