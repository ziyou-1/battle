    <style>
        body {
            background-color: #fff
        } 
        .layadmin-pagetabs {
            height: 40px;
            line-height: 40px;
            padding: 0 80px 0 40px;
            background-color: #fafafa;
            box-sizing: border-box;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.1);

            .layadmin-pagetabs .layui-tab-title li.layui-this, .layadmin-pagetabs .layui-tab-title li:hover {

<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    
    

<form class="layui-form" action="" style="margin-left:10px;margin-right:10px">
    <div class="layui-field-box" style="margin-left:0px;padding: 0px 0px;margin-top:10px">
        <div class="layui-form-item">
            <label class="layui-form-label">勾选游戏</label>
            <div class="layui-input-block">
[% for gm in games %]<input type="checkbox" name="games" value="[[ gm.gameName ]]"  title="[[ gm.gameName ]]" lay-filter="selectGame" lay-skin="tag" [% if eu and gm.gameName in eu_games %]checked=""[% endif %]/>[% endfor %]


            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">设置方式</label>
            <div class="layui-input-block">
                <input type="radio" name="setMode" value="0" title="">
                <div lay-radio>
                    <span lay-tips="将这些子账号的游戏权限全都设置成你选择的游戏">统一更换成所勾选的游戏</span>
                </div>
                <input type="radio" name="setMode" value="1" title="">
                <div lay-radio>
                    <span lay-tips="在现在游戏权限的基础上，新增你所选择的游戏。如果原本就有这个游戏权限，将忽略">在现有基础上新增勾选的游戏</span>
                </div>
            </div>
        </div>
    </div>
     
    <div style="text-align:center;align-items:center">
        <div class="layui-input-inline">
            <button class="layui-btn layui-btn-normal w-lg layui-disabled" id="saveBtn" lay-submit="" type="button" lay-filter="saveBtn" style="" disabled='disabled'>保存设定</button>
        </div>
    </div>

    <input type="hidden" id="uid" name="uid" />

</form>
<script src="/JS2019/User/setgames.js?v=20221008" type="text/javascript"></script>


</body>
</html>
