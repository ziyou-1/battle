<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>内部沟通</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="/layuiadmin/layui/css/layui.css?V=110293266" media="all">
    <link rel="stylesheet" href="/layuiadmin/style/admin.css" media="all">
    <link rel="stylesheet" href="/CSS/admin-skin.css?v=3" media="all" />
</head>

<body style="background:#f6f7fb;">
<div style="padding:28px 32px;line-height:2;color:#4a5568;">
    <h2 style="font-size:18px;color:#1f2d3d;margin-bottom:6px;">内部沟通</h2>
    <p style="color:#8a94a6;margin-bottom:18px;">本系统是本地部署版，没有接入原站的 IM（内部沟通）服务，因此不再显示聊天窗口。</p>

    <div class="layui-card" style="max-width:720px;">
        <div class="layui-card-header">替代方式</div>
        <div class="layui-card-body">
            <table class="layui-table" lay-size="sm" style="margin:0;">
                <tbody>
                <tr><td style="width:180px;"><b>站内消息</b></td><td>主框架右上角信封 → 「我的消息」，新订单 / 客户留言 / 售后 / 评价会在这里推送</td></tr>
                <tr><td><b>客户留言</b></td><td>客户端「在线客服」→ 进入对应客服的「我的消息」</td></tr>
                <tr><td><b>微信群通知</b></td><td>系统维护 → 「自动发消息到微信群设置」（配置企业微信群机器人后由后台推送）</td></tr>
                <tr><td><b>微信 / 公众号</b></td><td>系统维护 → 「微信公众号设置」（本版只保存配置，不实际外发）</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <p style="margin-top:18px;color:#9aa4b2;">
        订单里的「打手玩家对聊」「订单会话」等页面仍可正常查看历史记录；涉及微信建群、群二维码的功能在本版会提示未接入。
    </p>
</div>
</body>

</html>
