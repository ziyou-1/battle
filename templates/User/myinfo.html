                            <li><strong>设备与安全信息（可选）</strong>：设备型号、操作系统版本、IP地址、网络状态等。该信息仅用于风控校验、防止身份冒用及服务优化，不涉及个人身份识别。</li>
                        </ol>

                        <h2>四、敏感个人信息特别告知</h2>
                        <div class="highlight-box">
                            <p>若您所在商家启用人脸认证，请您特别注意：</p>
                            <ul>
                                <li><strong>处理目的</strong>：仅用于高安全等级场景下的身份核验，确保操作人员与认证主体一致，防范账号盗用、违规操作等风险。</li>
                                <li><strong>处理方式</strong>：人脸图像数据仅用于实时比对，不会用于任何其他商业用途或训练模型。</li>
                                <li><strong>单独同意</strong>：您需要通过独立的确认动作（如单独勾选、弹窗确认）明示同意我们处理您的人脸信息，该同意包含了基础实名认证同意。</li>
                                <li><strong>撤回同意</strong>：您可随时通过本协议第十条约定的渠道撤回对人脸信息处理的同意，撤回后我们将停止采集并删除已存储的人脸数据。</li>
                            </ul>
                        </div>

                        <h2>五、个人信息的使用目的</h2>
                        <p>我们仅在实现服务目的所必需的最小范围内使用您的个人信息，具体包括：</p>
                        <ol>
                            <li>完成入职商家的雇员身份真实性核验；</li>
                            <li>为后续技术服务支持、订单责任溯源、安全审计提供依据；</li>
                            <li>调查和处理涉嫌违法违规的行为（包括但不限于账号盗用、非法交易、恶意破坏系统安全等），保护入职商家的合法权益；</li>
                            <li>履行法律法规规定的义务。</li>
                        </ol>
                        <p><strong>我们承诺不会将您的个人信息用于上述目的之外的任何场景，也不会进行自动化决策。</strong></p>

                        <h2>六、服务性质与责任划分</h2>
                        <div style="background: #f9f9f9; border: 1px solid #e8e8e8; border-radius: 6px; padding: 12px 16px; margin: 12px 0;">
                            <p style="margin: 8px 0; text-align: justify;">1. <strong style="color: #000000;">技术服务定位</strong>：平台仅作为实名认证技术的提供方，为商家内部雇员入职提供身份核验的技术支持与系统工具。我们不对入职商家的经营管理行为、用工合法性、业务合规性等进行实质审查，亦不参与其内部人事管理决策。</p>
                            <p style="margin: 8px 0; text-align: justify;">2. <strong style="color: #000000;">商家主体责任</strong>：本商家应确保其使用本服务的目的、方式、范围均符合法律法规要求，并已依法取得雇员的充分授权与同意。因商家超出授权范围内使用本服务、未履行告知同意义务、或将本服务用于违法违规活动所产生的一切法律责任与纠纷，均由您入职的商家独立承担。</p>
                            <p style="margin: 8px 0; text-align: justify;">3. <strong style="color: #000000;">平台免责边界</strong>：在平台已履行法律法规规定的技术安全保障义务、且对商家的违法违规行为不存在明知或应知而未采取必要措施的情形下，平台不因商家的独立行为承担连带责任。</p>
                            <p style="margin: 8px 0; text-align: justify;">4. <strong style="color: #000000;">违规处置权</strong>：若我们发现或收到举报证实本商家存在滥用本服务、侵犯雇员权益或违反法律法规的行为，我们有权立即暂停或终止向其提供服务，并依法向有关主管部门报告。</p>
                        </div>

                        <h2>七、信息共享与披露限制</h2>
                        <p>未经您的明示同意，我们不会将您的实名信息共享给入职商家以外的任何第三方，但以下情形除外：</p>
                        <ol>
                            <li><strong>法定披露</strong>：根据适用法律、法规、监管要求或司法/行政机关的强制性命令；</li>
                            <li><strong>权益保护</strong>：为应对紧急情况下的人身、财产安全威胁，或调查处理严重违规行为以保护入职商家及用户的合法权益；</li>
                            <li><strong>技术支撑</strong>：向提供身份核验能力的第三方服务商共享必要信息，且我们会通过协议约束其严格保密并限定使用范围。</li>
                        </ol>

                        <h2>八、信息安全保障措施</h2>
                        <p>我们采取符合业界标准的安全防护措施保护您的个人信息，包括：</p>
                        <ul>
                            <li>数据传输全程加密，人脸信息等敏感数据存储采用加密算法；</li>
                            <li>实行严格的访问权限控制与操作审计，仅限授权人员按需访问；</li>
                            <li>定期开展安全评估与漏洞修复，建立应急响应机制。</li>
                        </ul>
                        <p><strong>若发生个人信息安全事件，我们将按照法律法规要求及时向您告知事件基本情况、可能影响、已采取措施及补救建议。</strong>尽管我们已尽合理努力，但互联网环境并非绝对安全，敬请理解。</p>

                        <h2>九、信息保存期限与删除规则</h2>
                        <ol>
                            <li>我们仅在实现处理目的所必要的最短期限内保留您的个人信息。</li>
                            <li><strong>人脸图像数据</strong>：保存期限不超过您在职期间及离职后合理追溯期，最长不超过2年；超出期限或您撤回同意后，我们将在30日内自动删除或匿名化处理。</li>
                            <li><strong>基础身份信息</strong>：保存至您从入职商家离职且相关责任追溯期满后，届时将依法删除或匿名化。</li>
                            <li>法律法规另有规定保存期限的，从其规定。</li>
                        </ol>

                        <h2>十、未成年人保护</h2>
                        <p><strong>本服务不面向未满18周岁的未成年人开放。</strong>我们不会故意收集未成年人的个人信息。若您发现我们误收集了未成年人信息，请通过平台官方任何渠道的客服联系我们提出请求，我们将按现行法律法规处理您的诉求。</p>

                        <h2>十一、您的权利</h2>
                        <p>您对自己的个人信息享有以下权利，可通过联系入职商家管理员撤销您的行使：</p>
                        <ol>
                            <li><strong>查阅、复制权</strong>：查询我们持有的您的个人信息副本；</li>
                            <li><strong>更正、补充权</strong>：发现信息有误时要求我们更正；</li>
                            <li><strong>删除权</strong>：符合法定删除情形时要求我们删除信息；</li>
                            <li><strong>撤回同意权</strong>：撤回对人脸信息等敏感信息的处理同意，撤回不影响此前基于同意已进行的处理效力；</li>
                            <li><strong>注销账户权</strong>：终止实名认证服务并要求删除相关信息；</li>
                            <li><strong>投诉举报权</strong>：对我们的信息处理行为提出质疑。</li>
                        </ol>
                        <p>我们将在收到请求后15个工作日内响应，因合理原因无法按时响应的，将向您说明情况。</p>

                        <h2>十二、协议更新</h2>
                        <p>我们可能适时修订本协议，重大变更（如新增敏感信息处理、延长保存期限、缩减用户权利等）将通过系统通知、弹窗等方式提前告知您，并重新获取您的同意。若您不同意更新后的协议，应停止使用本服务。</p>
