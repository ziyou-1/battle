[% if dev %]<script>window.addEventListener('error',function(e){try{navigator.sendBeacon('/api/DevApi/JsError',JSON.stringify({page:location.pathname,msg:String(e.message),src:String(e.filename)+':'+e.lineno}))}catch(x){}});window.addEventListener('unhandledrejection',function(e){try{navigator.sendBeacon('/api/DevApi/JsError',JSON.stringify({page:location.pathname,msg:'unhandledrejection: '+String(e.reason)}))}catch(x){}});</script>[% endif %]
<script src="/layuiadmin/layui/layui.js?V=110293266"></script>
<script type="text/javascript" src="/JS2019/common.js?v=11107"></script>


    <style>
        body {
            background-color: #fff
        } 
        .layadmin-pagetabs {
            height: 40px;
            line-height: 40px;
            padding: 0 80px 0 40px;
            background-color: #fafafa;
            box-sizing: border-box;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.1);
            border-bottom: 1px solid #1AA094;
        }
            .layadmin-pagetabs .layui-tab-title li.layui-this, .layadmin-pagetabs .layui-tab-title li:hover {
                background-color: #009688;
                color: #fff;
            }
    </style>
</head>
<body style="font-size:12px;" id="iosiframe">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>

<style>
    .layui-tab.sidetab {
        display: flex;
        align-items: flex-start;
    }

    .layui-tab-title li {
        font-weight: bold;
    }

    .layui-table thead tr, .layui-table-tool {
        background: #FCFCFC;
    }

    .layui-tab-title.sidetitle {
        width: 145px;
        display: flex;
        flex-direction: column;
        margin-right: 10px;
        background: #fff;
        position: static;
        height: auto;
        border-bottom: none;
    }

    .news10, .news20, .news0 {
        color: #fff;
        display: inline-block;
        text-align: center;
        background: red;
        border-radius: 50%;
        position: absolute;
        left: 0;
        top: 0;
        font-size: 12px;
        /* width: 30px;
        height: 30px;
        line-height: 30px;*/
        width: 30px;
        height: 20px;
        line-height: 20px;
        border-radius: 2px;
    }

    .sidetab.layui-tab-brief > .layui-tab-more li, .sidetab.layui-tab-brief > .layui-tab-title li {
        border-right: 4px solid transparent;
        position: relative;
        border-bottom: 1px solid #f2f2f2;
        line-height: 60px;
    }

        .sidetab.layui-tab-brief > .layui-tab-more li.layui-this, .sidetab.layui-tab-brief > .layui-tab-title .layui-this {
            border-right: 4px solid #5FB878;
        }

            .sidetab.layui-tab-brief > .layui-tab-more li.layui-this:after, .sidetab.layui-tab-brief > .layui-tab-title .layui-this:after {
                border-bottom: 0px solid #5FB878;
            }
</style>
<div id="root">
        <template id="template">
            {{ const i18n = layui.i18n; }}
            <div id="LAY_app">
                <form class="layui-form" action="" lay-filter="form">
                    <div class="layui-tab layui-tab-brief" lay-filter="tab">
                        <ul class="layui-tab-title">
                            <li class="layui-this" lay-id="10">{{= i18n.$t('page.tab1') }}</li>
                            <li lay-id="20">{{= i18n.$t('page.tab2') }}</li>
                        </ul>
                        <div class="layui-tab-content" style="background:#f0f0f0;">
                            <div class="layui-tab-item layui-show">

                                <div class="layui-tab layui-tab-brief sidetab" lay-filter="newstab">
                                    <ul class="layui-tab-title sidetitle">
                                        <li lay-id="20" class="layui-this">{{= i18n.$t('page.news20') }}<span class="news20"></span></li>
                                        <li lay-id="10">{{= i18n.$t('page.news10') }}<span class="news10"></span></li>
                                        <li lay-id="0">{{= i18n.$t('page.news0') }}<span class="news0"></span></li>


                                    </ul>

                                    <div class="layui-tab-content" style="background:#fff;padding-top:0px;flex:1;">
                                        <div class="layui-tab-item layui-show">
                                            <div class="layui-tab layui-tab-brief" lay-filter="threetab">
                                                <ul class="layui-tab-title">
                                                    <li class="layui-this" lay-id="N">{{= i18n.$t('page.threetab1') }}</li>
                                                    <li lay-id="Y">{{= i18n.$t('page.threetab2') }}</li>
                                                </ul>
                                                <div class="layui-tab-content">
                                                    <div class="layui-tab-item layui-show" style="margin-top:20px">
                                                        <table class="" id="unReadTableList" lay-filter="unReadTableList"></table>
                                                        <script type="text/html" id="unReadtoolbarDemo">
                                                            <div class="layui-btn-container">
                                                                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="{{= i18n.$t('page.refreshTit') }}"><i class="layui-icon">&#xe669;</i>{{= i18n.$t('page.refresh') }}</button>
                                                                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="readBtn" type="button" title="{{= i18n.$t('page.readBtnTit') }}"><i class="larry-icon larry-jia"></i>{{= i18n.$t('page.readBtn') }}</button>
                                                                <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="readAll" type="button" title="{{= i18n.$t('page.readAllTit') }}"><i class="larry-icon larry-jia"></i>{{= i18n.$t('page.readAll') }}</button>
                                                            </div>
                                                        </script>
                                                    </div>

                                                    <div class="layui-tab-item" style="margin-top:20px">
                                                        <table class="" id="readTableList" lay-filter="readTableList"></table>
                                                        <script type="text/html" id="readToolbarDemo">
                                                            <div class="layui-btn-container">
                                                                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="{{= i18n.$t('page.refreshTit') }}"><i class="layui-icon">&#xe669;</i>{{= i18n.$t('page.refresh') }}</button>
                                                            </div>
                                                        </script>
                                                    </div>

                                                </div>
                                            </div>

                                        </div>

                                    </div>
                                </div>

                            </div>

                            <div class="layui-tab-item" style="background:#fff;">
                                <div class="layui-form-item" style="margin-top:20px">
                                    <label class="layui-form-label" style="width:100px">{{= i18n.$t('page.msgsound') }}</label>
                                    <div class="layui-input-block">
                                        <input type="radio" name="msgsound" lay-filter="msgsound" value="Y" title="{{= i18n.$t('page.msgsoundradio1') }}" [% if (user.isPlayMsgSound or "Y") != "N" %]checked[% endif %]>
                                        <input type="radio" name="msgsound" lay-filter="msgsound" value="N" title="{{= i18n.$t('page.msgsoundradio2') }}" [% if user.isPlayMsgSound == "N" %]checked[% endif %]>
                                    </div>
                                </div>
                                <div class="layui-form-item" style="">
                                    <label class="layui-form-label" style="width:100px">{{= i18n.$t('page.selectsound') }}</label>
                                    <div class="layui-input-block">
                                        <input type="radio" name="selectsound" lay-filter="selectsound" value="0" title="{{= i18n.$t('page.selectsoundradio1') }}" [% if (user.myMsgSoundSoure|string) != "2" %]checked[% endif %]>
                                        <input type="radio" name="selectsound" lay-filter="selectsound" value="2" title="{{= i18n.$t('page.selectsoundradio2') }}" [% if (user.myMsgSoundSoure|string) == "2" %]checked[% endif %]>
                                    </div>
                                </div>

                                <div class="layui-form-item" style="">
                                    <label class="layui-form-label" style="width:100px">{{= i18n.$t('page.resetPushWechatMsgOrderLable') }}</label>
                                    <div class="layui-input-block">
                                        <div class="layui-btn layui-btn-sm layui-btn-normal resetPushWechatMsgOrder" lay-tips="{{= i18n.$t('page.resetPushWechatMsgOrderTit') }}">{{= i18n.$t('page.resetPushWechatMsgOrder') }}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </template>
    </div>

<script src="/JS2019/jquery-3.3.1.min.js"></script>
<script src="/JS2019/User/mymessage.js?v=20260430" type="text/javascript"></script>


</body>
</html>
