<form class="layui-form" action="" lay-filter="form">
    <div class="" style="padding-left: 5px;padding-top:10px"> 
        <div class="layui-form-pane">
            <div class="layui-inline" style="width: 400px;">
                <label class="layui-form-label" style="width: 80px">系统用户</label>
                <div class="layui-input-inline" style="width: 320px;">
                    <select name="userList" xm-select="userList" xm-select-skin="default" xm-select-height="36px" xm-select-search=""></select>
                </div>
            </div>
            <div class="layui-inline" style="width: 400px;">
                <label class="layui-form-label" style="width: 80px">IP范围</label>
                <div class="layui-input-inline" style="width: 320px;">
                    <input type="text" name="IPWhitelist" id="IPWhitelist" lay-verify="" placeholder="搜索IP范围" autocomplete="off" class="layui-input" value="">

                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline" style="">
                    <button class="layui-btn layui-btn-normal" lay-submit="" type="button" lay-filter="seachBtn" style="width: 80px">搜索</button>
                </div>
            </div>
        </div>
    </div>

    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="switchTpl1">
            <input type="checkbox" name="sta" value="{{d.UserLoginRestrictId}}" lay-skin="switch" lay-text="生效|禁用" lay-filter="statusChecked" {{ d.Status == '0' ? 'checked' : '' }}>
        </script>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs layui-btn-danger" style="margin-right:5px" lay-event="refresh" type="button" title="刷新列表"><i class="layui-icon layui-zhuce"></i>刷新列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-normal" style="margin-right:5px" lay-event="addUserLoginRestrictBtn" type="button" title="新增限制子账号规则">新增限制子账号规则</button>
                <button class="layui-btn layui-btn-xs" style="margin-right:5px" lay-event="batchEditUserLoginRestrictBtn" type="button" title="批量修改子账号规则">批量修改子账号规则</button>
                <button class="layui-btn layui-btn-xs layui-btn-normal" style="margin-right:5px" lay-event="addUserLoginRestrictIPBtn" type="button" title="新增一个按IP限制登录的规则">新增按IP禁封规则</button>
                <button class="layui-btn layui-btn-xs layui-btn-warm" style="margin-right:5px" lay-event="batchDelUserLoginRestrictBtn" type="button" title="新增删除规则">批量刪除规则</button>

            </div>
            <div style="color:#ff6a00" id="total"></div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs" style="margin-right:0px" lay-event="submitEdit" title="修改规则"><i class="layui-icon layui-icon-edit"></i></a>
        </script>
    </div>

    <div class="addDislabelIPDiv" style="padding:10px 10px;display:none">
        <div class="layui-form-pane">            
            <div class="layui-form-item">
                <label class="layui-form-label" style="padding: 8px 6px;" title="">限制IP地址</label>
                <div class="layui-input-block">
                    <input type="text" name="blackIP" id="blackIP" placeholder="请输入要限制的IP，支持网段添加 如：100.100.100.1/24" autocomplete="off" class="layui-input" value="">
                </div>
                <div style="padding-top:10px;color:#ff0000">支持网段添加 如：100.100.100.1/24  代表从100.100.100.1到100.100.100.254都将无法访问</div>
            </div>            
            <div class="layui-form-item" style="text-align:center;margin:0 auto">
                <a href="javascript:void(0)" class="layui-btn layui-btn-normal saveBlackIPBtn" style="margin-top:50px;margin-left:50px; width:150px">保存规则</a>
            </div>
        </div>
    </div>
   
</form>
