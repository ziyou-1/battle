<form class="layui-form" action="" lay-filter="">
    <div class="layui-carousel " id="topMsg" lay-filter="topMsg" style="background-color:#fff">
        <div carousel-item="" class="topsList">

        </div>
    </div>

    <div class="normalList">
    </div> 
    
    <div class="sendLyaer">
        <blockquote class="layui-elem-quote">
            您在此发布的业务消息所有用平台管理系统的商家均能看到，此功能适用于寻求订单方面上下家合作，不适合用于招募散人打手。请勿发布虚假、违法等垃圾信息，否则平台有权删除或禁止该系统发布消息
        </blockquote>
        <div class="layui-form-item">
            <label class="layui-form-label">发单还是接单</label>
            <div class="layui-input-block">
                <input type="radio" name="beg" value="0" title="接单" checked="checked">
                <input type="radio" name="beg" value="1" title="发单">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="" title="">发布内容</label>
            <div class="layui-input-block">
                <textarea placeholder="请输入要发布的寻求合作内容，不超过200个字符" class="layui-textarea" name="inputContent" id="inputContent" maxlength="200"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="" title="">是否置顶</label>
            <div class="layui-input-block">
                <select name="tops" id="tops" lay-verify="">
                    <option value="0" selected="selected">不置顶</option>
                    <option value="3">3小时3元</option>
                    <option value="6">6小时6元</option>
                    <option value="12">半天12元</option>
                    <option value="24">1天24元</option>
                    <option value="72">3天72元</option>
                    <option value="168">7天168元</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="" title="">联络微信</label>
            <div class="layui-input-block">
                <input type="text" name="concantwechat" id="concantwechat" lay-verify="" autocomplete="off" placeholder="必填" class="layui-input" maxlength="50">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="" title="">联络QQ</label>
            <div class="layui-input-block">
                <input type="text" name="concantqq" id="concantqq" lay-verify="" autocomplete="off" placeholder="必填" class="layui-input" maxlength="50">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" style="" title=""></label>
            <button type="submit" class="layui-btn" lay-submit="" lay-filter="subBtn">确定发布出去</button>
        </div>
    </div>
    <input type="hidden" id="defineGame" name="defineGame" value="全部游戏" />

</form>
