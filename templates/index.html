    let flashInterval;
    function advancedTitleFlash(flashText, options = {}) {
        if (flashInterval) return false
        const {
            interval = 800,
            prefix = '',
            suffix = '',
            timeout = 0,
            restoreOnStop = true
        } = options;

        const originalTitle = document.title;
        let isFlashing = true;

        const updateTitle = () => {
            document.title = document.title === originalTitle
                ? `${prefix}${flashText}${suffix}`
                : originalTitle;
        };

        const startFlashing = () => {
            flashInterval = setInterval(() => {
                if (isFlashing) updateTitle();
            }, interval);
        };

        const stopFlashing = () => {
            isFlashing = false;
            clearInterval(flashInterval);
            flashInterval = null
            if (restoreOnStop) document.title = originalTitle;
            removeEventListeners();
        };

        const removeEventListeners = () => {
            document.removeEventListener('click', stopFlashing);
            document.removeEventListener('keydown', stopFlashing);
            document.removeEventListener('scroll', stopFlashing);
            document.removeEventListener('mousemove', stopFlashing);
            document.removeEventListener('touchstart', stopFlashing);
        };

        // 初始化闪烁
        updateTitle();
        startFlashing();

        // 添加多种交互事件监听
        document.addEventListener('click', stopFlashing);
        document.addEventListener('keydown', stopFlashing);
        document.addEventListener('scroll', stopFlashing);
        document.addEventListener('mousemove', stopFlashing);
        document.addEventListener('touchstart', stopFlashing);

        // 设置自动停止
        if (timeout > 0) {
            setTimeout(stopFlashing, timeout);
        }

        return stopFlashing;
    }

        }
        if (Notification.permission === "granted") return true;
        if (Notification.permission === "denied") {
            Notification.requestPermission().then(function (permission) {
                if (permission === 'granted') {
                    return true;
                } else if (permission === 'denied') {
                    return false;
                }
            });
        }
    }

    async function sendNotification(data) {

        }

        // 显示系统通知
        if (hasPermission) {
            const notification = new Notification("新消息", {
                body: data.nick + ':' + data.payload.text,
                icon: data.avatar,
            });
            notification.onclick = () => {
                window.focus();
                notification.close();
            };
            setTimeout(() => notification.close(), 4000);
        }

        function InitEventHandle() {
            websocket.onerror = function () {
                console.log('WebSocket连接发生错误');
            }
            websocket.onopen = function () {
                console.log('webSocket connection success');
                //心跳检测重置
                heartCheck.reset().start();
            }
            websocket.onmessage = function (event) {
                heartCheck.reset().start();
                if (event.data == "pong") {
                    return;
                }
                if (typeof event.data !== 'string') {
                    console.warn("Received non-string data:", event.data);
                    return;
                }
                let msgData;


                if (event.data != null && event.data != "" && event.data != undefined) {
                    let msgData;
                    try {
                        msgData = JSON.parse(event.data);
                    } catch (e) {
                        console.error("Invalid JSON:", event.data);
                        return;
                    }
                    if (msgData === null || typeof msgData !== 'object' || Array.isArray(msgData)) {
                        console.warn("Expected JSON object, got:", msgData);
                        return;
                    }
                    if (msgData.msgList) {

        var heartCheck = {
            timeout: 1000 * 60 * 5,//5分钟发一次心跳
            timeoutObj: null,
            serverTimeoutObj: null,
            reset: function () {
                clearTimeout(this.timeoutObj);
                clearTimeout(this.serverTimeoutObj);
                return this;
            },
            start: function () {
                var self = this;
                this.timeoutObj = setTimeout(function () {
                    try {
                        websocket.send("ping");
                    }
                    catch (ex) {
                    }
                    self.serverTimeoutObj = setTimeout(function () {
                        try {
                            websocket.close();
                        }
                        catch (ex) {
                        }
                    }, self.timeout)
                }, this.timeout)
            }

        function execChildPageMethod(pageUrl, methodName, args = []) {
            function getCleanPath(url) {
                try {
                    // 如果是相对路径，拼接成绝对路径再解析
                    const fullUrl = new URL(url, window.location.origin).href;
                    return new URL(fullUrl).pathname;
                } catch (e) {
                    //console.warn('Invalid URL:', url);
                    return url.split('?')[0].split('#')[0];
                }
            }

            const targetPath = getCleanPath(pageUrl);
            let found = false;
            let success = false;

            $('iframe').each(function () {
                const $iframe = $(this);
                let src = $iframe.attr('src') || '';
                if (!src) return true;
                const iframePath = getCleanPath(src);
                if (iframePath === targetPath) {
                    found = true;
                    const iframeWin = this.contentWindow;

                    if (!iframeWin) {
                        notice.warning('iframe 未加载完成');
                        return false;
                    }

                    try {
                        if (typeof iframeWin[methodName] === 'function') {
                            iframeWin[methodName].apply(iframeWin, args);
                            success = true;
                        } else {
                            //notice.warning(`子页面中未找到方法：${methodName}`);
                        }
                    } catch (e) {
                        console.error('执行子页面方法出错:', e);
                        //notice.error('执行失败：' + (e.message || e));
                    }

                    return false; // 停止遍历
                }
            });

            if (!found) {
                //notice.warning('页面未打开：' + pageUrl);
            }

            return success;
        }
    });
